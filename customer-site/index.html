<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>おうちノート</title>
<style>
  :root {
    --ink: #2b2b2b;
    --ink-soft: #767676;
    --line: #e6e2da;
    --bg: #faf7f2;
    --card: #ffffff;
    --accent: #2B4C6F;
    --accent-soft: #e8eef4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px 90px; }
  .header { text-align: center; padding: 10px 0 18px; }
  .header .logo { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.05em; }
  .header h1 { font-size: 21px; margin: 6px 0 2px; }
  .header .sub { font-size: 12.5px; color: var(--ink-soft); }
  .progress-card {
    background: var(--accent-soft); border-radius: 14px; padding: 16px;
    text-align: center; margin-bottom: 18px;
  }
  .progress-card .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .progress-card .stage { font-size: 19px; font-weight: 700; color: var(--accent); }
  .quicklinks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .quicklinks button {
    border: 1px solid var(--line); background: var(--card); border-radius: 12px;
    padding: 12px 4px; font-size: 12px; color: var(--ink); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
  }
  .quicklinks button .ic { font-size: 20px; }
  .section { margin-bottom: 24px; }
  .section-title {
    font-size: 15px; font-weight: 700; color: var(--accent);
    margin: 0 0 10px; display: flex; align-items: center; gap: 6px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .card-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .card-body { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; }
  .empty { font-size: 13px; color: var(--ink-soft); padding: 10px 2px; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photo-grid img {
    width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px;
    border: 1px solid var(--line); cursor: pointer; background: #eee;
  }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 14px; }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 6px; }
  .updated { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: 30px; }
  .comingsoon { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
  .comingsoon .ic { font-size: 34px; display: block; margin-bottom: 10px; }

  .tabpanel { display: none; }
  .tabpanel.active { display: block; }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--card); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(6, 1fr);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tabbar button {
    border: 0; background: transparent; padding: 8px 2px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10.5px; color: var(--ink-soft);
  }
  .tabbar button .ic { font-size: 18px; }
  .tabbar button.active { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading" id="loadingMsg">読み込み中…</div>
  </div>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="home"><span class="ic">🏠</span>ホーム</button>
    <button data-tab="message"><span class="ic">💬</span>メッセージ</button>
    <button data-tab="reserve"><span class="ic">📅</span>予約</button>
    <button data-tab="spec"><span class="ic">🛠️</span>設備仕様</button>
    <button data-tab="sample"><span class="ic">📦</span>サンプル</button>
    <button data-tab="album"><span class="ic">📷</span>資料・写真</button>
  </nav>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
    <img id="lightboxImg" src="">
  </div>

<script>
// おうちノートは住まいるアプリ本体（社内アプリ）のNetlifyサイトが持つ
// APIをそのまま利用する（別サイトとして公開しているためドメインを絶対URLで指定）。
var API_BASE = "https://sprightly-pegasus-9b65a7.netlify.app";

function esc(s) {
  return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function photoUrl(slug, key) {
  return API_BASE + '/api/get-photo?slug=' + encodeURIComponent(slug) + '&key=' + encodeURIComponent(key);
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

function renderPhotoGrid(slug, photos) {
  if (!photos || !photos.length) return '';
  return '<div class="photo-grid">' + photos.map(function(p){
    return '<img src="' + esc(photoUrl(slug, p.key)) + '" onclick="openLightbox(this.src)" loading="lazy">';
  }).join('') + '</div>';
}

function comingSoonHtml(label){
  return '<div class="comingsoon"><span class="ic">🚧</span>' + esc(label) + 'は近日公開予定です。<br>今しばらくお待ちください。</div>';
}

function switchTab(tab){
  document.querySelectorAll('.tabpanel').forEach(function(el){ el.classList.toggle('active', el.dataset.tab===tab); });
  document.querySelectorAll('.tabbar button').forEach(function(el){ el.classList.toggle('active', el.dataset.tab===tab); });
  window.scrollTo(0,0);
}

async function main() {
  var params = new URLSearchParams(location.search);
  var slug = params.get('c') || params.get('slug');
  var app = document.getElementById('app');

  if (!slug) {
    app.innerHTML = '<div class="error">ページが見つかりません。<br>URLをご確認ください。</div>';
    return;
  }

  var data;
  try {
    var res = await fetch(API_BASE + '/api/get-note?slug=' + encodeURIComponent(slug));
    if (res.status === 404) {
      app.innerHTML = '<div class="error">まだ準備中です。<br>担当者にお問い合わせください。</div>';
      return;
    }
    if (!res.ok) throw new Error('failed');
    data = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="error">読み込みに失敗しました。<br>時間をおいて再度お試しください。</div>';
    return;
  }

  var customerName = data.customerName || '';
  var stage = data.constructionStage || '';
  var meetings = data.meetings || [];
  var specs = data.specs || [];
  var confirmations = data.confirmations || [];
  var furniture = data.furniture || [];
  var album = data.album || [];
  var folders = data.folders || [];

  var html = '';

  // ---- ホーム ----
  html += '<div class="tabpanel active" data-tab="home">';
  html += '<div class="header">';
  html += '<div class="logo">🏠 住まいるハウジング</div>';
  html += '<h1>' + esc(customerName ? customerName + '様' : 'お客様') + ' おうちノート</h1>';
  html += '<div class="sub">これまでの打合せ・仕様・お写真をご確認いただけます</div>';
  html += '</div>';
  html += '<div class="progress-card"><div class="label">現在の進行状況</div><div class="stage">' + esc(stage || '準備中') + '</div></div>';
  html += '<div class="quicklinks">';
  html += '<button data-goto="spec"><span class="ic">🛠️</span>設備仕様</button>';
  html += '<button data-goto="album"><span class="ic">📷</span>資料・写真</button>';
  html += '<button data-goto="message"><span class="ic">💬</span>メッセージ</button>';
  html += '</div>';
  if (meetings.length) {
    html += '<div class="section"><div class="section-title">📝 最近の打合せ記録</div>';
    html += meetings.slice(0,3).map(function(m){
      return '<div class="card"><div class="card-sub">' + esc(m.date || '') + '</div><div class="card-title">' + esc(m.title || '') + '</div><div class="card-body">' + esc(m.content || '') + '</div></div>';
    }).join('');
    html += '</div>';
  }
  if (data.updatedAt) {
    var d = new Date(data.updatedAt);
    html += '<div class="updated">最終更新：' + esc(d.toLocaleString('ja-JP')) + '</div>';
  }
  html += '</div>';

  // ---- メッセージ（準備中）----
  html += '<div class="tabpanel" data-tab="message">' + comingSoonHtml('メッセージ機能') + '</div>';

  // ---- 予約（準備中）----
  html += '<div class="tabpanel" data-tab="reserve">' + comingSoonHtml('ご予約機能') + '</div>';

  // ---- 設備仕様 ----
  html += '<div class="tabpanel" data-tab="spec">';
  html += '<div class="section"><div class="section-title">🛠️ 設備仕様</div>';
  html += specs.length
    ? specs.map(function(s){
        return '<div class="card"><div class="card-title">' + esc(s.category || '') + '</div><div class="card-body">' + esc(s.content || '') + '</div>' + renderPhotoGrid(slug, s.photos) + '</div>';
      }).join('')
    : '<div class="empty">まだ仕様の記録がありません。</div>';
  html += '</div>';
  html += '<div class="section"><div class="section-title">✅ 確認事項</div>';
  html += confirmations.length
    ? confirmations.map(function(c){
        return '<div class="card"><div class="card-title">' + esc(c.label || '') + '</div><div class="card-body">' + esc(c.content || '') + '</div>' + renderPhotoGrid(slug, c.photos) + '</div>';
      }).join('')
    : '<div class="empty">まだ確認事項がありません。</div>';
  html += '</div>';
  html += '</div>';

  // ---- サンプル（準備中）----
  html += '<div class="tabpanel" data-tab="sample">' + comingSoonHtml('サンプル請求機能') + '</div>';

  // ---- 資料・写真 ----
  html += '<div class="tabpanel" data-tab="album">';
  if (furniture.length) {
    html += '<div class="section"><div class="section-title">🛋️ 家具・インテリア</div>';
    html += furniture.map(function(f){
      return '<div class="card"><div class="card-title">' + esc(f.label || '') + '</div><div class="card-body">' + esc(f.content || '') + '</div></div>';
    }).join('');
    html += '</div>';
  }
  html += '<div class="section"><div class="section-title">📷 写真アルバム</div>';
  html += album.length ? renderPhotoGrid(slug, album) : '<div class="empty">まだ写真がありません。</div>';
  html += '</div>';
  if (folders.length) {
    html += '<div class="section"><div class="section-title">📁 写真フォルダ</div>';
    html += folders.map(function(f){
      return '<div class="card"><div class="card-title">' + esc(f.name || '') + '</div>' + renderPhotoGrid(slug, f.photos) + '</div>';
    }).join('');
    html += '</div>';
  }
  html += '</div>';

  app.innerHTML = html;
  document.getElementById('tabbar').hidden = false;

  document.querySelectorAll('.tabbar button').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.dataset.tab); });
  });
  document.querySelectorAll('[data-goto]').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.dataset.goto); });
  });
  document.querySelector('.tabbar button[data-tab="home"]').classList.add('active');
}

main();
</script>
</body>
</html>
<!-- rebuild trigger -->
