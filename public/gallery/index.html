<style>
/* Layout: a quiet header, a sticky row of room chips, then a masonry wall of photos that opens into a full-screen viewer. */
:root{
  --bg:#f7f3ee;
  --surface:#fffdfa;
  --fg:#2f2925;
  --muted:#8a8079;
  --line:#e9e2da;
  --accent:#5d5049;
  --accent-ink:#ffffff;
  --chip:#efe9e3;
  --shade:rgba(30,24,20,.94);
  --font-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{padding-block:28px 14px}
.brand{font-size:12px;letter-spacing:.14em;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5.4vw,36px);line-height:1.3;margin:4px 0 10px;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:38em}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:10px;padding-block:10px 12px}
.mode{display:inline-flex;align-self:flex-start;background:var(--chip);border-radius:999px;padding:3px}
.mode button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:6px 16px;border-radius:999px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
.chip .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:18px 40px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-head h2{font-family:var(--font-display);font-weight:500;font-size:22px;margin:0}
.sec-head .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-note{margin:-6px 0 14px;color:var(--muted);font-size:13px}

.wall{columns:2 160px;column-gap:8px}
@media (min-width:720px){.wall{columns:3 220px;column-gap:12px}}
@media (min-width:1040px){.wall{columns:4 220px}}
.tile{position:relative;display:block;width:100%;break-inside:avoid;margin:0 0 8px;background:var(--chip);border-radius:4px;overflow:hidden}
.tile .open{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.heart{appearance:none;border:0;cursor:pointer;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.88);color:#8a8079;width:36px;height:36px;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .15s}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9}
.heart[aria-pressed="true"]{color:#e0577a}
.heart[aria-pressed="true"] svg{fill:currentColor}
.heart:active{transform:scale(.9)}
.tile .heart{position:absolute;right:6px;bottom:6px}
.vheart{width:44px;height:44px;background:rgba(255,255,255,.12);color:#f2f2ef;box-shadow:none}
.vheart[aria-pressed="true"]{color:#ff8fab}
.viewer-top .vbtns{display:flex;gap:8px}
.likenote{margin:10px 0 0;font-size:13px;color:var(--muted)}
.mode button .n{font-size:11px;margin-left:4px;font-variant-numeric:tabular-nums}
.empty{padding:40px 12px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2f2925;color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;max-width:calc(100% - 32px)}
@media (min-width:720px){.tile{margin-bottom:12px}}
.tile .open img{display:block;width:100%;height:auto;transition:opacity .2s}
@media (hover:hover){.tile .open:hover img{opacity:.88}}

footer{border-top:1px solid var(--line);padding-block:18px 28px;color:var(--muted);font-size:12px}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;flex-direction:column;color:#f2f2ef;touch-action:pan-y}
.viewer-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.viewer-top .where{font-size:13px;letter-spacing:.04em;font-variant-numeric:tabular-nums;opacity:.85}
.vbtn{appearance:none;border:0;background:rgba(255,255,255,.12);color:#f2f2ef;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.vbtn:hover{background:rgba(255,255,255,.2)}
.vbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px max(8px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:50%;transform:translateY(-50%)}
.nav.prev{left:max(12px,env(safe-area-inset-left,0px))}
.nav.next{right:max(12px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.nav{display:none}}
.hint{text-align:center;font-size:12px;opacity:.6;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
@media (min-width:641px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="wrap">
  <div class="brand">住まいるハウジング</div>
  <h1>イメージ集</h1>
  <p class="lead">これまでに建てたお家の写真です。場所ごとに見比べたり、1軒まるごと見たりできます。写真をタップすると大きく表示されます。</p>
  <p class="likenote" id="likeNote"></p>
</header>

<div class="bar">
  <div class="wrap">
    <div class="mode" role="group" aria-label="見方">
      <button type="button" id="m-room" aria-pressed="true">場所別</button>
      <button type="button" id="m-case" aria-pressed="false">施工事例</button>
      <button type="button" id="m-like" aria-pressed="false">🩷 いいね<span class="n" id="likeCount"></span></button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="カテゴリ"></div>
  </div>
</div>

<main class="wrap">
  <div class="sec-head"><h2 id="sec-title"></h2><span class="count" id="sec-count"></span></div>
  <p class="sec-note" id="sec-note" hidden></p>
  <div class="wall" id="wall"></div>
</main>

<footer class="wrap">住まいるハウジング　釧路市緑ヶ岡2丁目38番5号</footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="写真の拡大表示">
  <div class="viewer-top">
    <span class="where" id="v-where"></span>
    <span class="vbtns"><button type="button" class="heart vheart" id="v-heart" aria-pressed="false" aria-label="いいね"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    <button type="button" class="vbtn" id="v-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
  </div>
  <div class="stage" id="stage">
    <img id="v-img" alt="">
    <button type="button" class="vbtn nav prev" id="v-prev" aria-label="前の写真"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="vbtn nav next" id="v-next" aria-label="次の写真"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="hint">左右にスワイプで前後の写真へ</div>
</div>

  setNote();
  try {
    const r = await fetch("/api/gallery-like?p=" + encodeURIComponent(LINK.p) + "&t=" + encodeURIComponent(LINK.t), {cache:"no-store"});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "error");
    liked = new Set(j.liked || []);
  } catch(e) {
    serverMode = false; liked = loadLocal(); setNote();
  }
  refreshLikes();
}
async function toggleLike(f){
  const on = !liked.has(f);
  if (on) liked.add(f); else liked.delete(f);
  refreshLikes(f);
  if (!serverMode) { saveLocal(); return; }
  try {
    const r = await fetch("/api/gallery-like", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({p: LINK.p, t: LINK.t, photo: f, like: on})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "error");
  } catch(e) {
    if (on) liked.delete(f); else liked.add(f);
    refreshLikes(f);
    toast(String(e.message) === "limit_reached" ? "いいねは300枚までです。" : "保存できませんでした。通信状況を確かめて、もう一度押してください。");
  }
}
function refreshLikes(f){
  $("likeCount").textContent = liked.size ? String(liked.size) : "";
  document.querySelectorAll(".tile .heart").forEach(b => b.setAttribute("aria-pressed", liked.has(b.dataset.f)));
  if (!$("viewer").hidden && list[idx]) $("v-heart").setAttribute("aria-pressed", liked.has(list[idx].f));
  if (mode === "like" && $("viewer").hidden) renderWall();
  else if (mode === "like") $("sec-count").textContent = liked.size + "枚";
}

function modeOf(id){ return id === "like" ? "like" : GROUPS.case.some(g => g.id === id) ? "case" : "room"; }
function info(id){ return id === "like" ? LIKE_GROUP : GROUPS[modeOf(id)].find(g => g.id === id); }

function renderChips(){
  $("m-room").setAttribute("aria-pressed", mode === "room");
  $("m-case").setAttribute("aria-pressed", mode === "case");
  $("m-like").setAttribute("aria-pressed", mode === "like");
  $("chips").hidden = mode === "like";
  if (mode === "like") return;
  $("chips").innerHTML = GROUPS[mode].map(g =>
    `<button type="button" class="chip" data-id="${g.id}" aria-pressed="${g.id === current}">${g.name}<span class="n">${(byGroup[g.id]||[]).length}</span></button>`
  ).join("");
}

function renderWall(){
  const g = info(current);
  list = current === "like" ? likedList() : (byGroup[current] || []);
  $("sec-title").textContent = g.name;
  $("sec-count").textContent = list.length + "枚";
  $("sec-note").hidden = !g.note;
  $("sec-note").textContent = g.note || "";
  if (current === "like" && !list.length) {
    $("wall").innerHTML = '<div class="empty" style="column-span:all">まだいいねした写真はありません。<br>気になる写真の ' + HEART.replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.9"') + ' を押すと、ここにまとまります。</div>';
    return;
  }
  $("wall").innerHTML = list.map((p, i) =>
    `<div class="tile"><button type="button" class="open" data-i="${i}" aria-label="${g.name}の写真 ${i+1}を大きく見る"><img src="/gallery/t/${p.f}.jpg" width="${p.w}" height="${p.h}" loading="${i < 8 ? "eager" : "lazy"}" decoding="async" alt=""></button>` +
    `<button type="button" class="heart" data-f="${p.f}" aria-pressed="${liked.has(p.f)}" aria-label="いいね">${HEART}</button></div>`
  ).join("");
}

function show(id, opts = {}){
  if (!info(id)) id = "gaikan";
  current = id; mode = modeOf(id);
  renderChips(); renderWall();
  try { history.replaceState(null, "", "#" + id); } catch(e) {}
  const chip = document.querySelector(`.chip[data-id="${id}"]`);
  if (chip) chip.scrollIntoView({inline:"center", block:"nearest"});
  if (opts.top) window.scrollTo({top:0});
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (b) show(b.dataset.id, {top:true});
});
$("m-room").addEventListener("click", () => { if (mode !== "room") show(GROUPS.room[0].id, {top:true}); });
$("m-case").addEventListener("click", () => { if (mode !== "case") show(GROUPS.case[0].id, {top:true}); });
$("m-like").addEventListener("click", () => { if (mode !== "like") show("like", {top:true}); });

/* viewer */
let lastFocus = null;
function open(i){
  idx = i; lastFocus = document.activeElement;
  $("viewer").hidden = false; document.body.style.overflow = "hidden";
  draw(); $("v-close").focus();
}
function close(){
  $("viewer").hidden = true; document.body.style.overflow = "";
  if (mode === "like") renderWall();
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
function draw(){
  const p = list[idx];
  const img = $("v-img");
  img.src = "/gallery/t/" + p.f + ".jpg";
  const full = new Image();
  full.onload = () => { if (list[idx] === p) img.src = full.src; };
  full.src = "/gallery/p/" + p.f + ".jpg";
  $("v-where").textContent = `${info(current).name}　${idx+1} / ${list.length}`;
  $("v-heart").setAttribute("aria-pressed", liked.has(p.f));
  [idx-1, idx+1].forEach(j => { if (list[j]) new Image().src = "/gallery/t/" + list[j].f + ".jpg"; });
}
function step(d){ idx = (idx + d + list.length) % list.length; draw(); }

$("wall").addEventListener("click", e => {
  const h = e.target.closest(".heart"); if (h) { toggleLike(h.dataset.f); return; }
  const t = e.target.closest(".open"); if (t) open(+t.dataset.i);
});
$("v-heart").addEventListener("click", e => { e.stopPropagation(); if (list[idx]) toggleLike(list[idx].f); });
$("v-close").addEventListener("click", close);
$("v-prev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
$("v-next").addEventListener("click", e => { e.stopPropagation(); step(1); });
$("stage").addEventListener("click", e => { if (e.target.id === "stage") close(); });
document.addEventListener("keydown", e => {
  if ($("viewer").hidden) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});
let sx = null, sy = null;
$("stage").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("stage").addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) close();
  sx = sy = null;
}, {passive:true});

show((location.hash || "").slice(1) || "gaikan");
initLikes();
</script>
</body>
</html>
