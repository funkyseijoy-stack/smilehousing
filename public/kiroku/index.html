<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a302b">
<meta name="robots" content="noindex, nofollow">
<title>お打合せの記録｜住まいるハウジング</title>
<link rel="icon" href="/note/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/note/icons/apple-touch-icon.png">
<style>
  :root{
    --page:#efe9e2; --bg:#f7f3ee; --card:#fffdfa; --line:#e9e2da; --line2:#ded5cb;
    --ink:#2f2925; --ink2:#5c534d; --muted:#9a9089; --brown:#5d5049; --chip:#efe9e3;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--page); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6; }
  .app{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:calc(48px + env(safe-area-inset-bottom)); }
  .hd{ background:#3a302b; padding:calc(20px + env(safe-area-inset-top)) 18px 18px; }
  .hd .en{ font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif; font-size:1.05rem; letter-spacing:.3em; color:#f1e6d6; }
  .hd .rule{ height:1px; width:120px; background:rgba(216,191,157,.55); margin:8px 0; }
  .hd .ttl{ font-size:.72rem; letter-spacing:.35em; color:#cdb9a0; }
  .wrap{ padding:20px 16px; }
  h1{ font-size:1.3rem; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:.85rem; margin:0 0 18px; }
  .rec{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px; }
  .rec .date{ display:inline-block; background:var(--chip); color:var(--brown); border-radius:999px; padding:2px 10px; font-size:.8rem; font-weight:700; }
  .rec .title{ font-weight:700; font-size:1.05rem; margin:8px 0 2px; }
  .rec .memo{ white-space:pre-wrap; color:var(--ink2); font-size:.95rem; margin-top:4px; }
  .files{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:12px; }
  .file{ display:block; text-decoration:none; color:var(--ink); border:1px solid var(--line2); border-radius:12px; overflow:hidden; background:#fff; }
  .file .th{ aspect-ratio:3/4; background:#f2ede7; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .file .th img, .file .th canvas{ width:100%; height:100%; object-fit:contain; display:block; background:#fff; }
  .file .th .ph{ font-size:2rem; color:var(--muted); }
  .file .nm{ font-size:.8rem; padding:6px 8px; display:flex; justify-content:space-between; gap:6px; }
  .file .nm span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file .nm b{ color:var(--brown); flex-shrink:0; font-weight:700; }
  .empty, .err{ color:var(--muted); font-size:.92rem; text-align:center; padding:28px 12px; background:var(--card); border:1px dashed var(--line2); border-radius:14px; }
  .foot{ text-align:center; color:var(--muted); font-size:.78rem; margin-top:24px; }
  .jump{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
  .jump a{ flex:1 1 72px; white-space:nowrap; text-align:center; text-decoration:none; color:var(--ink); background:var(--card); border:1.5px solid var(--line); border-radius:999px; padding:9px 4px; font-size:.85rem; font-weight:700; }
  .jump a.helpbtn{ background:var(--chip); }
  .khelp{ position:fixed; inset:0; z-index:50; background:rgba(40,32,28,.45); display:flex; align-items:flex-end; justify-content:center; }
  .khelp[hidden]{ display:none; }
  .khelp-card{ position:relative; background:var(--bg); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:22px 20px calc(28px + env(safe-area-inset-bottom)); box-sizing:border-box; }
  .khelp-card h2{ font-size:1.15rem; margin:0 0 6px; }
  .khelp-card h3{ font-size:1rem; margin:20px 0 6px; }
  .khelp-card .lead{ color:var(--ink2); font-size:.92rem; margin:0; }
  .khelp-card .hsub{ font-weight:700; font-size:.88rem; color:var(--brown); margin:10px 0 2px; }
  .khelp-card ol, .khelp-card ul{ margin:0; padding-left:1.4em; font-size:.92rem; line-height:1.75; color:var(--ink2); }
  .khelp-card .x{ position:absolute; top:10px; right:12px; width:36px; height:36px; border-radius:50%; border:none; background:var(--chip); font-size:1.3rem; color:var(--ink2); cursor:pointer; }
  .khelp-card .close2{ display:block; width:100%; margin-top:22px; padding:12px; border-radius:999px; border:none; background:var(--brown); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  h2.sec{ font-size:1.12rem; margin:30px 0 4px; scroll-margin-top:12px; }
  .nw{ display:inline-block; background:#d9534f; color:#fff; font-size:.72rem; font-weight:700; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle; }
  .scom{ background:var(--card); border:1.5px solid var(--line); border-left:5px solid var(--brown); border-radius:16px; padding:12px 14px; margin:0 0 16px; }
  .scom .sh{ font-weight:700; font-size:.9rem; color:var(--brown); margin-bottom:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .scom .sd{ font-weight:400; font-size:.76rem; color:var(--muted); }
  .scom .st{ white-space:pre-wrap; line-height:1.7; font-size:.92rem; }
  .upd{ background:#fff8ec; border:1.5px solid #f0d9a8; border-radius:16px; padding:12px 14px; margin:0 0 16px; }
  .upd .uh{ font-weight:700; font-size:.95rem; margin-bottom:2px; }
  .upd .us{ font-size:.76rem; color:var(--muted); margin-bottom:8px; }
  .upd .ur{ display:flex; align-items:center; gap:8px; width:100%; box-sizing:border-box; text-align:left; text-decoration:none; background:#fff; border:1px solid #f0e2c4; border-radius:12px; padding:10px 12px; margin-top:6px; font-size:.9rem; color:var(--ink); }
  .upd .ur .ut{ flex:1; min-width:0; }
  .upd .ur .ug{ color:var(--muted); }
  .upd .uok{ display:block; margin:10px 0 0 auto; background:transparent; color:var(--brown); border:1.5px solid var(--line); border-radius:999px; padding:8px 16px; font:inherit; font-size:.85rem; font-weight:700; cursor:pointer; }
  .msgs{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .msg{ max-width:82%; padding:10px 12px; border-radius:16px; font-size:.92rem; white-space:pre-wrap; line-height:1.55; word-break:break-word; }
  .msg .mm{ font-size:.72rem; opacity:.7; margin-bottom:3px; }
  .msg.staff{ background:var(--card); border:1.5px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.me{ background:var(--brown); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .composer{ display:flex; gap:8px; align-items:flex-end; }
  .composer textarea{ flex:1; font:inherit; font-size:16px; padding:10px 12px; border:1.5px solid var(--line2); border-radius:14px; background:#fff; resize:vertical; min-height:48px; box-sizing:border-box; }
  .composer button{ flex-shrink:0; padding:12px 18px; border:none; border-radius:999px; background:var(--brown); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .composer button:disabled{ opacity:.5; }
  .secsub{ color:var(--muted); font-size:.82rem; margin:0 0 12px; }
  .next{ background:var(--brown); color:#fff; border-radius:16px; padding:14px 16px; margin-bottom:18px; }
  .next .l{ font-size:.75rem; opacity:.8; letter-spacing:.08em; } .next .v{ font-weight:700; font-size:1.05rem; margin-top:2px; }
  .rvstep{ font-weight:700; font-size:.92rem; margin:18px 0 8px; }
  .rvtypes{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .rvtype{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font:inherit; cursor:pointer; color:var(--ink); text-align:left; }
  .rvtype b{ font-size:1rem; } .rvtype span{ font-size:.75rem; color:var(--muted); }
  .rvtype.on{ background:#ead9cf; border-color:var(--brown); }
  .rvdays{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .rvday{ flex:0 0 74px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:9px 4px; text-align:center; font:inherit; color:var(--ink); cursor:pointer; }
  .rvday .a{ font-size:.66rem; color:var(--muted); } .rvday .b{ font-size:1.3rem; font-weight:700; line-height:1.25; } .rvday .c{ font-size:.66rem; color:#5c8a6f; }
  .rvday.off{ opacity:.45; cursor:default; } .rvday.off .c{ color:var(--muted); }
  .rvday.on{ background:var(--brown); border-color:var(--brown); color:#fff; } .rvday.on .a,.rvday.on .c{ color:#eadfd6; }
  .rvslots{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .rvslot{ background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 0; font:inherit; font-size:.95rem; color:var(--ink); cursor:pointer; }
  .rvslot:disabled{ opacity:.4; text-decoration:line-through; cursor:default; }
  .rvslot.on{ background:var(--brown); border-color:var(--brown); color:#fff; }
  .rvopen{ width:100%; border-radius:14px; padding:15px 6px; font:inherit; font-size:1.05rem; font-weight:700; letter-spacing:.06em; background:var(--card); border:2px solid var(--brown); color:var(--brown); cursor:pointer; }
  .rvopen.on{ background:var(--brown); color:#fff; }
  .gal{ display:flex; align-items:center; gap:14px; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; text-decoration:none; color:var(--ink); }
  .gal .gi{ flex:none; width:46px; height:46px; border-radius:12px; background:var(--chip); display:grid; place-items:center; color:var(--brown); }
  .gal .gt{ flex:1; min-width:0; }
  .gal .gt b{ display:block; font-size:1rem; }
  .gal .gt span{ display:block; color:var(--muted); font-size:.82rem; }
  .gal .ga{ flex:none; color:var(--brown); font-weight:700; font-size:.9rem; }
  #rvBox[hidden]{ display:none; }
  .bookbtn{ width:100%; margin-top:18px; border-radius:14px; padding:15px 6px; font:inherit; font-size:1rem; font-weight:700; letter-spacing:.08em; background:var(--brown); border:1.5px solid var(--brown); color:#fff; cursor:pointer; }
  .bookbtn:disabled{ opacity:.45; cursor:default; }
  .rvnote{ color:var(--muted); font-size:.78rem; margin-top:10px; line-height:1.6; }
  .about .ab-pt{ font-weight:700; color:var(--ink); margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .about .ab-pt:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .about .ab-px{ margin-top:6px; }
  .fin{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .fin .fk{ font-weight:700; font-size:1.02rem; }
  .fin .fd{ color:var(--muted); font-size:.82rem; margin-top:2px; }
  .fin .fm{ color:var(--ink2); font-size:.92rem; margin-top:4px; white-space:pre-wrap; }
  .fin .files{ grid-template-columns:1fr 1fr; }
  .fin details{ margin-top:10px; }
  .fin summary{ cursor:pointer; color:var(--brown); font-size:.88rem; font-weight:700; }
  .fin .old{ display:flex; justify-content:space-between; gap:8px; padding:8px 2px; border-top:1px solid var(--line); text-decoration:none; color:var(--ink); font-size:.9rem; }
  .fin .old b{ color:var(--brown); flex-shrink:0; }
  .about{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:16px; white-space:pre-wrap; color:var(--ink2); font-size:.95rem; }
  .toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#3a302b; color:#fff; padding:10px 18px; border-radius:999px; font-size:.9rem; z-index:9; max-width:90vw; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div class="en">SMILE HOUSING</div>
    <div class="rule"></div>
    <div class="ttl">お打合せの記録</div>
  </div>
  <div class="wrap" id="main"><div class="empty">読み込んでいます…</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
(function(){
  var main = document.getElementById("main");
  var WD = "日月火水木金土";
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function ymd(d){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d||""); return m ? new Date(Number(m[1]), Number(m[2])-1, Number(m[3])) : null; }
  function fmtDate(d){
    var dt = ymd(d); if(!dt) return esc(d||"");
    return dt.getFullYear()+"年"+(dt.getMonth()+1)+"月"+dt.getDate()+"日（"+WD[dt.getDay()]+"）";
  }
  function isPdf(f){ return (f.contentType||"").indexOf("pdf")>=0 || /\.pdf$/i.test(f.name||""); }
  function isImg(f){ return (f.contentType||"").indexOf("image/")===0; }
  function toast(msg){
    var el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 3500);
  }
  var qs = new URLSearchParams(location.search);
  var P = qs.get("p"), T = qs.get("t");
  if(!P || !T){ main.innerHTML = '<div class="err">リンクが正しくありません。お送りしたリンクからもう一度開いてください。</div>'; return; }
  var data = null;
  var rv = { type:"打合せ", dur:120, date:"", start:"", avail:null, loading:false, loaded:false, error:"", booking:false, open:false };

  fetch("/api/early-data?p="+encodeURIComponent(P)+"&t="+encodeURIComponent(T), {cache:"no-store"})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(!res.ok){ main.innerHTML = '<div class="err">このリンクは開けません。お手数ですが、担当者にお問い合わせください。</div>'; return; }
      data = res.j; data.reservations = data.reservations || [];
      initSeen();
      renderAll();
    })
    .catch(function(){ main.innerHTML = '<div class="err">読み込めませんでした。通信状況を確認して、もう一度開いてください。</div>'; });

  // ---------- 前回ご覧になってから更新されたこと（この端末で最後に開いたときと比べる。初めては出さない） ----------
  var seenSince = null, updDismissed = false;
  function initSeen(){
    var key = "kirokuLastSeen:"+P, prev = null;
    try{ prev = localStorage.getItem(key); localStorage.setItem(key, new Date().toISOString()); }catch(e){}
    seenSince = prev || null;
  }
  function isNew(t){ return !!(seenSince && t && String(t) > seenSince); }
  function nwTag(t){ return isNew(t) ? '<span class="nw">NEW</span>' : ''; }
  // スタッフの「お客様へのひとこと」（住まいるアプリのヒアリングタブで書く。おうちノートと同じ文章）
  function staffCommentHtml(){
    var sc = data.staffComment;
    if(!sc || !sc.text) return "";
    var d = sc.at ? new Date(sc.at) : null;
    return '<div class="scom"><div class="sh">💬 スタッフより'+(d && !isNaN(d) ? '<span class="sd">'+(d.getMonth()+1)+'/'+d.getDate()+'</span>' : '')+nwTag(sc.at)+'</div><div class="st">'+esc(sc.text)+'</div></div>';
  }
  function updatesHtml(){
    if(!seenSince || updDismissed) return "";
    var rows = [];
    var recs = (data.records||[]).filter(function(r){ return isNew(r.upd); });
    if(recs.length) rows.push(["🗒", "お打合せの記録 "+recs.length+"件", "sec-rec"]);
    if((data.hearing||[]).length && isNew(data.hearingUpd)) rows.push(["📋", "ご要望のまとめ", "sec-hear"]);
    var fins = (data.financeDocs||[]).filter(function(d){ return isNew(d.upd); });
    if(fins.length) rows.push(["💰", "資金計画・お見積り "+fins.length+"件", "sec-fin"]);
    var msgs = (data.messages||[]).filter(function(m){ return !m.fromCustomer && isNew(m.createdAt); });
    if(msgs.length) rows.push(["💬", "メッセージ "+msgs.length+"件", "sec-msg"]);
    var resv = (data.reservations||[]).filter(function(r){ return isNew(r.createdAt); });
    if(resv.length) rows.push(["📅", "ご予約 "+resv.map(function(r){ var d = ymd(r.date); return (d ? (d.getMonth()+1)+"/"+d.getDate() : r.date)+" "+r.startTime; }).slice(0,2).join("、"), "sec-resv"]);
    if(!rows.length) return "";
    var sd = new Date(seenSince);
    return '<div class="upd" id="updBox"><div class="uh">📢 新着のお知らせ</div><div class="us">前回（'+(sd.getMonth()+1)+'/'+sd.getDate()+'）ご覧になってから届いたもの</div>'+
      rows.map(function(r){ return '<a class="ur" href="#'+r[2]+'"><span>'+r[0]+'</span><span class="ut">'+esc(r[1])+'</span><span class="ug">›</span></a>'; }).join("")+
      '<button class="uok" type="button" data-updok="1">とじる</button></div>';
  }
  function nextHtml(){
    var n = data.reservations[0];
    if(!n) return "";
    return '<div class="next"><div class="l">次回のご予約</div><div class="v">'+fmtDate(n.date)+' '+esc(n.startTime)+(n.endTime?'〜'+esc(n.endTime):'')+'　'+esc(n.type)+'</div>'+
      (data.reservations.length>1?'<div class="l" style="margin-top:6px;">ほか '+(data.reservations.length-1)+'件のご予約があります</div>':'')+'</div>';
  }
  function renderAll(){
    var name = String(data.customer||"").trim();
    if(name && !/様$/.test(name)) name += " 様";
    var html = '<h1>'+(name?esc(name):'お客様')+'</h1><p class="sub">住まいるハウジングとのお打合せの記録です。</p>';
    var fins = data.financeDocs || [];
    var hear = data.hearing || [];
    html += '<div class="jump"><a href="#sec-rec">記録</a>'+(hear.length?'<a href="#sec-hear">ご要望</a>':'')+(fins.length?'<a href="#sec-fin">資金計画</a>':'')+'<a href="#sec-msg">メッセージ</a><a href="#sec-gal">施工事例</a><a href="#sec-resv">ご予約</a>'+((data.companyIntro||data.policy)?'<a href="#sec-about">会社について</a>':'')+'<a href="#help" class="helpbtn" data-khelp>❔ 使い方</a></div>';
    html += staffCommentHtml();
    html += updatesHtml();
    html += '<div id="nextBox">'+nextHtml()+'</div>';
    html += '<h2 class="sec" id="sec-rec">お打合せの記録</h2><p class="secsub">新しいものから順に並んでいます。資料は押すと開きます。</p>';
    if(!data.records || !data.records.length){
      html += '<div class="empty">まだ記録はありません。<br>お打合せのあとにこちらに追加されます。</div>';
    } else {
      html += data.records.map(function(r){
        var files = (r.files||[]).map(function(f, i){
          var thumb = isImg(f) ? '<img loading="lazy" src="'+esc(f.url)+'" alt="">' :
            (isPdf(f) ? '<canvas data-pdf="'+esc(f.url)+'"></canvas>' : '<span class="ph">📄</span>');
          return '<a class="file" href="'+esc(f.url)+'" target="_blank" rel="noopener"><div class="th">'+thumb+'</div>'+
            '<div class="nm"><span>'+esc(f.name||("資料"+(i+1)))+'</span><b>ひらく</b></div></a>';
        }).join("");
        return '<div class="rec"><span class="date">'+fmtDate(r.date)+'</span>'+nwTag(r.upd)+
          (r.title?'<div class="title">'+esc(r.title)+'</div>':'')+
          (r.memo?'<div class="memo">'+esc(r.memo)+'</div>':'')+
          (files?'<div class="files">'+files+'</div>':'')+
        '</div>';
      }).join("");
    }
    if(hear.length){
      html += '<h2 class="sec" id="sec-hear">ご要望のまとめ</h2><p class="secsub">お伺いしたご要望をまとめました'+(data.hearingAt?'（'+fmtDate(data.hearingAt)+'更新）':'')+'。違うところや付け足したいことがあれば、担当者にお知らせください。</p>'+
        '<div class="rec">'+hear.map(function(h, i){
          return '<div'+(i?' style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line);"':'')+'><div class="title">'+esc(h.label)+'</div><div class="memo">'+esc(h.text)+'</div></div>';
        }).join("")+'</div>';
    }
    if(fins.length){
      html += '<h2 class="sec" id="sec-fin">資金計画・お見積り</h2><p class="secsub">いちばん新しいものを上に出しています。押すと開きます。</p>';
      var kinds = [];
      fins.forEach(function(d){ if(kinds.indexOf(d.kind)<0) kinds.push(d.kind); });
      var ORDER = ["資金計画書","概算見積書"];
      kinds.sort(function(a,b){ var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b); return (ia<0?9:ia)-(ib<0?9:ib); });
      html += kinds.map(function(k){
        var ds = fins.filter(function(d){ return d.kind===k; });
        // いちばん新しい日付のものは全部並べて出す（同じ日に2枚以上入れたとき、1枚だけ「以前の版」に隠れないように）
        var top = ds[0], latest = ds.filter(function(d){ return d.date===top.date; }), olds = ds.filter(function(d){ return d.date!==top.date; });
        var memos = latest.map(function(d){ return d.memo; }).filter(function(m, i, a){ return m && a.indexOf(m)===i; });
        var tiles = latest.map(function(d){
          var f = d.file;
          var thumb = isImg(f) ? '<img loading="lazy" src="'+esc(f.url)+'" alt="">' : (isPdf(f) ? '<canvas data-pdf="'+esc(f.url)+'"></canvas>' : '<span class="ph">📄</span>');
          return '<a class="file" href="'+esc(f.url)+'" target="_blank" rel="noopener"><div class="th">'+thumb+'</div><div class="nm"><span>'+esc(f.name||k)+'</span><b>ひらく</b></div></a>';
        }).join("");
        return '<div class="fin"><div class="fk">'+esc(k)+(ds.some(function(d){ return isNew(d.upd); })?'<span class="nw">NEW</span>':'')+'</div><div class="fd">'+fmtDate(top.date)+'の版</div>'+
          memos.map(function(m){ return '<div class="fm">'+esc(m)+'</div>'; }).join("")+
          '<div class="files">'+tiles+'</div>'+
          (olds.length?'<details><summary>以前の版（'+olds.length+'件）</summary>'+olds.map(function(o){
            return '<a class="old" href="'+esc(o.file.url)+'" target="_blank" rel="noopener"><span>'+fmtDate(o.date)+(o.memo?'　'+esc(o.memo):'')+'</span><b>ひらく</b></a>';
          }).join("")+'</details>':'')+
        '</div>';
      }).join("");
    }
    html += '<h2 class="sec" id="sec-msg">メッセージ</h2><p class="secsub">ご質問・ご相談などはこちらからどうぞ。担当者からのお返事もここに届きます。</p><div id="msgBox">'+msgListHtml()+'</div>'+
      '<div class="composer"><textarea id="msgInput" rows="2" placeholder="メッセージを入力"></textarea><button type="button" id="msgSend">送信</button></div>';
    html += '<h2 class="sec" id="sec-gal">施工事例・イメージ集</h2><p class="secsub">住まいるハウジングで建てたお家の写真です。気に入った写真に🩷を押すと、「いいね」にまとまります。</p>'+
      '<a class="gal" href="/gallery/?p='+encodeURIComponent(P)+'&t='+encodeURIComponent(T)+'" target="_blank" rel="noopener"><span class="gi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m4 17 5-5 4 4 2-2 5 5"/></svg></span>'+
      '<span class="gt"><b>イメージ集を見る</b><span>外観・LDK・水まわりなど</span></span><span class="ga">ひらく ›</span></a>';
    html += '<h2 class="sec" id="sec-resv">ご予約</h2><p class="secsub">「予約する」を押すと、空いている日時を選んで予約できます。</p>'+
      '<button class="rvopen'+(rv.open?" on":"")+'" id="rvToggle">'+(rv.open?"▲ 閉じる":"📅 予約する")+'</button><div id="rvBox"'+(rv.open?"":" hidden")+'></div>';
    // 会社紹介の文章のあとに、家づくりの進め方（ご契約の考え方）を小さな見出し＋ふつうの文章で添える
    if(data.companyIntro || data.policy){
      html += '<h2 class="sec" id="sec-about">住まいるハウジングについて</h2><div class="about">'+
        (data.companyIntro?'<div>'+esc(data.companyIntro)+'</div>':'')+
        (data.policy&&data.policy.title?'<div class="ab-pt">'+esc(data.policy.title)+'</div>':'')+
        (data.policy&&data.policy.text?'<div class="ab-px">'+esc(data.policy.text)+'</div>':'')+
      '</div>';
    }
    html += '<div class="foot">住まいるハウジング</div>';
    main.innerHTML = html;
    renderResv();
    drawPdfThumbs();
  }

  // ---------- メッセージ（おうちノートと同じやりとり。/api/early-data に POST） ----------
  function msgListHtml(){
    var ms = data.messages || [];
    if(!ms.length) return '<div class="empty" style="margin-bottom:10px;">まだメッセージはありません。</div>';
    return '<div class="msgs">'+ms.map(function(m){
      var me = m.fromCustomer;
      return '<div class="msg '+(me?"me":"staff")+'"><div class="mm">'+(me?"あなた":esc(m.sender||"住まいるハウジング"))+' ・ '+msgTime(m.createdAt)+(me?'':nwTag(m.createdAt))+'</div>'+esc(m.content)+'</div>';
    }).join("")+'</div>';
  }
  function msgTime(iso){
    var d = new Date(iso||""); if(isNaN(d)) return "";
    return (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  }
  var msgSending = false;
  function sendMsg(){
    var ta = document.getElementById("msgInput");
    var text = ((ta && ta.value)||"").trim();
    if(!text || msgSending) return;
    msgSending = true;
    var btn = document.getElementById("msgSend"); if(btn) btn.disabled = true;
    fetch("/api/early-data", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ p:P, t:T, action:"message", text:text }) })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(!res.ok || !res.j.ok) throw new Error("ng");
        data.messages = data.messages || [];
        data.messages.push(res.j.message);
        ta.value = "";
        document.getElementById("msgBox").innerHTML = msgListHtml();
        toast("送信しました");
      })
      .catch(function(){ toast("送信できませんでした。もう一度お試しください"); })
      .then(function(){ msgSending = false; if(btn) btn.disabled = false; });
  }

  // ---------- 予約（おうちノートと同じ空き状況・カレンダー。/api/note-calendar を earlyToken で使う） ----------
  function needDur(){ var o = rv.avail && rv.avail.durationOptions && rv.avail.durationOptions[rv.type]; return o ? (o.indexOf(rv.dur)!==-1 ? rv.dur : o[0]) : 120; }
  function loadAvail(){
    rv.loading = true; rv.error = ""; renderResv();
    fetch("/api/note-calendar?p="+encodeURIComponent(P)+"&t="+encodeURIComponent(T)+"&d="+needDur(), {cache:"no-store"})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||"error"); return j; }); })
      .then(function(j){
        rv.avail = j; rv.loaded = true;
        if(j.types && j.types.indexOf(rv.type)===-1) rv.type = j.types[0];
        var day = j.days.filter(function(d){ return d.date===rv.date; })[0];
        if(!day || day.status!=="open"){ var f = j.days.filter(function(d){ return d.status==="open"; })[0]; rv.date = f ? f.date : ""; }
      })
      .catch(function(){ rv.error = "unavailable"; rv.loaded = true; })
      .then(function(){ rv.loading = false; renderResv(); });
  }
  function rvDay(date){ return rv.avail ? rv.avail.days.filter(function(d){ return d.date===date; })[0] : null; }
  function lastStart(){ var c = rv.avail.close.split(":"), m = parseInt(c[0],10)*60+parseInt(c[1],10)-rv.avail.durationMinutes; return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2); }
  function renderResv(){
    var box = document.getElementById("rvBox");
    if(!box) return;
    var nb = document.getElementById("nextBox"); if(nb) nb.innerHTML = nextHtml();
    var out = "";
    var types = (rv.avail && rv.avail.types) || ["打合せ","オンライン"];
    out += '<div class="rvstep">1. ご希望の内容</div><div class="rvtypes">'+types.map(function(t){
      var opt = rv.avail && rv.avail.durationOptions && rv.avail.durationOptions[t];
      return '<button class="rvtype'+(rv.type===t?" on":"")+'" data-rvtype="'+esc(t)+'"><b>'+esc(t)+'</b><span>'+(opt?"1〜2時間":"2時間")+'</span></button>';
    }).join("")+'</div>';
    var durOpts = rv.avail && rv.avail.durationOptions && rv.avail.durationOptions[rv.type];
    if(durOpts){
      out += '<div class="rvstep">所要時間（1時間か2時間）</div><div class="rvtypes">'+durOpts.map(function(m){
        return '<button class="rvtype'+(needDur()===m?" on":"")+'" data-rvdur="'+m+'"><b>'+(m/60)+'時間</b></button>';
      }).join("")+'</div>';
    }
    out += '<div class="rvstep">2. 日付</div>';
    if(rv.loading || !rv.loaded){
      out += '<div class="empty">空き状況を確認中です…</div>';
    } else if(rv.error){
      out += '<div class="empty">ただいま空き状況を表示できません。<br>お手数ですが、LINEなどでご希望の日時をお知らせください。</div>';
    } else {
      out += '<div class="rvdays">'+rv.avail.days.map(function(d){
        var dt = ymd(d.date);
        var label = d.status==="open" ? "空きあり" : d.status==="full" ? "満席" : (d.reason||"休み");
        return '<button class="rvday'+(d.status==="open"?"":" off")+(rv.date===d.date?" on":"")+'" data-rvdate="'+d.date+'"'+(d.status==="open"?"":" disabled")+'>'+
          '<div class="a">'+(dt.getMonth()+1)+'月・'+esc(d.wd||WD[dt.getDay()])+'</div><div class="b">'+dt.getDate()+'日</div><div class="c">'+esc(label)+'</div></button>';
      }).join("")+'</div>';
      var day = rvDay(rv.date);
      out += '<div class="rvstep">3. 開始時間（30分単位）</div>';
      if(!day || day.status!=="open") out += '<div class="empty">日付を選んでください。</div>';
      else out += '<div class="rvslots">'+day.slots.map(function(sl){
        return '<button class="rvslot'+(rv.start===sl.start?" on":"")+'" data-rvstart="'+sl.start+'"'+(sl.available?"":" disabled")+'>'+sl.start+'</button>';
      }).join("")+'</div>';
      out += '<button class="bookbtn" id="rvBook"'+((rv.date&&rv.start&&!rv.booking)?"":" disabled")+'>'+(rv.booking?"予約中…":"この内容で予約する")+'</button>';
      out += '<div class="rvnote">ご予約の開始時間 '+esc(rv.avail.open)+'〜'+esc(rv.avail.lastStart||lastStart())+'<br>ご予約は前日の17時まで受け付けています（当日のご予約はできません）。<br>日曜日・祝日のご予約や、変更・キャンセルは、LINEなどで担当者にお知らせください。</div>';
    }
    // 日付の横並びは、描き直しても押した日付の位置のまま（先頭に戻さない）
    var rdOld = box.querySelector('.rvdays'), rdLeft = rdOld ? rdOld.scrollLeft : 0;
    box.innerHTML = out;
    var rdNew = box.querySelector('.rvdays'); if(rdNew && rdLeft) rdNew.scrollLeft = rdLeft;
  }
  function bookNow(){
    if(!rv.date || !rv.start || rv.booking) return;
    rv.booking = true; renderResv();
    fetch("/api/note-calendar", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ p:P, t:T, action:"book", type:rv.type, date:rv.date, start:rv.start, duration:needDur() }) })
      .then(function(r){ return r.json().then(function(j){ return {status:r.status, ok:r.ok, j:j}; }); })
      .then(function(res){
        rv.booking = false;
        if(res.status===409){ toast("その時間は先に埋まりました。別の時間をお選びください"); rv.start = ""; loadAvail(); return; }
        if(!res.ok){ renderResv(); toast("予約できませんでした。もう一度お試しいただくか、LINEなどでご連絡ください"); return; }
        var r = res.j.reservation;
        data.reservations.push({ type:r.type, date:r.date, startTime:r.startTime, endTime:r.endTime });
        data.reservations.sort(function(a,b){ return (a.date+a.startTime).localeCompare(b.date+b.startTime); });
        rv.start = "";
        toast("ご予約を受け付けました");
        loadAvail();
        try{ document.getElementById("nextBox").scrollIntoView({behavior:"smooth", block:"start"}); }catch(e){}
      })
      .catch(function(){ rv.booking = false; renderResv(); toast("予約できませんでした。もう一度お試しいただくか、LINEなどでご連絡ください"); });
  }
  function setResvOpen(on){
    rv.open = on;
    var b = document.getElementById("rvToggle"), box = document.getElementById("rvBox");
    if(b){ b.className = "rvopen"+(on?" on":""); b.textContent = on ? "▲ 閉じる" : "📅 予約する"; }
    if(box) box.hidden = !on;
    if(on && !rv.loaded && !rv.loading) loadAvail();
  }
  main.addEventListener("click", function(e){
    if(e.target.closest("[data-khelp]")){ e.preventDefault(); openHelp(); return; }
    if(e.target.closest("#rvToggle")){ setResvOpen(!rv.open); return; }
    if(e.target.closest("#msgSend")){ sendMsg(); return; }
    if(e.target.closest("[data-updok]")){ updDismissed = true; var ub = document.getElementById("updBox"); if(ub) ub.remove(); return; }
    var ur = e.target.closest('.upd a.ur[href="#sec-resv"]'); if(ur) setResvOpen(true);
    if(e.target.closest('.jump a[href="#sec-resv"]')) setResvOpen(true);
    var rt = e.target.closest("[data-rvtype]"); if(rt){ rv.type = rt.dataset.rvtype; rv.start = ""; if(rv.avail && rv.avail.durationMinutes !== needDur()) loadAvail(); else renderResv(); return; }
    var rdu = e.target.closest("[data-rvdur]"); if(rdu){ rv.dur = parseInt(rdu.dataset.rvdur,10); rv.start = ""; if(rv.avail && rv.avail.durationMinutes !== needDur()) loadAvail(); else renderResv(); return; }
    var rd = e.target.closest("[data-rvdate]"); if(rd){ rv.date = rd.dataset.rvdate; rv.start = ""; renderResv(); return; }
    var rs = e.target.closest("[data-rvstart]"); if(rs){ rv.start = rs.dataset.rvstart; renderResv(); return; }
    if(e.target.closest("#rvBook")) bookNow();
  });

  // 「使い方」（ホーム画面への追加方法と画面の見方）。おうちノートの「？」と同じ考え方
  function openHelp(){
    var el = document.getElementById("khelp");
    if(!el){
      el = document.createElement("div"); el.id = "khelp"; el.className = "khelp";
      el.addEventListener("click", function(e){ if(e.target===el || e.target.closest("[data-khelpx]")) el.hidden = true; });
      document.body.appendChild(el);
    }
    var fins = (data && data.financeDocs) || [];
    var about = data && (data.companyIntro || data.policy);
    el.innerHTML = '<div class="khelp-card" role="dialog" aria-label="このページの使い方">'+
      '<button class="x" type="button" data-khelpx aria-label="閉じる">×</button>'+
      '<h2>このページの使い方</h2>'+
      '<p class="lead">ホーム画面に追加すると、アプリのようにすぐ開けて便利です。</p>'+
      '<h3>📱 ホーム画面への追加方法</h3>'+
      '<div class="hsub">iPhone（Safari）の場合</div>'+
      '<ol><li>画面下の共有ボタン（四角に↑のマーク）をタップ</li><li>「ホーム画面に追加」をタップ</li><li>右上の「追加」をタップ</li></ol>'+
      '<div class="hsub">Android（Chrome）の場合</div>'+
      '<ol><li>右上の「⋮」（メニュー）をタップ</li><li>「ホーム画面に追加」または「アプリをインストール」をタップ</li><li>「追加」をタップ</li></ol>'+
      '<h3>📄 画面の見方</h3>'+
      '<ul>'+
        '<li><b>記録</b>：お打合せのメモをご覧いただけます。資料は押すと開きます</li>'+
        ((data && data.hearing && data.hearing.length) ? '<li><b>ご要望のまとめ</b>：お伺いしたご要望を項目ごとにまとめています</li>' : '')+
        (fins.length ? '<li><b>資金計画・お見積り</b>：資金計画書やお見積りをご覧いただけます</li>' : '')+
        '<li><b>メッセージ</b>：ご質問・ご相談を送れます。担当者からのお返事もここに届きます</li>'+
        '<li><b>施工事例・イメージ集</b>：住まいるハウジングで建てたお家の写真です。気に入った写真に🩷を押すと「いいね」にまとまります</li>'+
        '<li><b>ご予約</b>：「📅 予約する」から、次回のご来店やご相談を予約できます</li>'+
        (about ? '<li><b>会社について</b>：住まいるハウジングのご紹介です</li>' : '')+
      '</ul>'+
      '<button class="close2" type="button" data-khelpx>閉じる</button>'+
    '</div>';
    el.hidden = false;
  }

  // PDFの1ページ目を見本として描く（1件ずつ順番に）
  function drawPdfThumbs(){
    if(typeof pdfjsLib === "undefined" || !pdfjsLib.getDocument){
      document.querySelectorAll("canvas[data-pdf]").forEach(function(c){ var ph = document.createElement("span"); ph.className = "ph"; ph.textContent = "📄"; c.replaceWith(ph); });
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    var list = Array.prototype.slice.call(document.querySelectorAll("canvas[data-pdf]"));
    (function next(){
      var c = list.shift();
      if(!c) return;
      pdfjsLib.getDocument(c.dataset.pdf).promise.then(function(doc){
        return doc.getPage(1).then(function(page){
          var vp1 = page.getViewport({scale:1});
          var vp = page.getViewport({scale: 600/Math.max(vp1.width, vp1.height)});
          c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
          return page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise.then(function(){ try{ doc.destroy(); }catch(e){} });
        });
      }).catch(function(){
        var ph = document.createElement("span"); ph.className = "ph"; ph.textContent = "📄";
        c.replaceWith(ph);
      }).then(next);
    })();
  }
})();
