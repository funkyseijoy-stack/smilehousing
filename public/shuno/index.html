<!DOCTYPE html>
<html lang="ja">
<head>

<title>収納プラン（IKEA ボーアクセル）｜住まいるハウジング</title>

<style>

  }

    -webkit-font-smoothing:antialiased; line-height:1.6; }
  button,input,textarea,select{ font-family:inherit; font-size:1rem; }
  .app{ max-width:640px; margin:0 auto; min-height:100vh; background:var(--bg); }
  .hd{ background:#3a302b; padding:18px 18px 16px; }
  .hd .co{ color:#f1e6d6; font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif; letter-spacing:.28em; font-size:1rem; }

  .hd .sb{ color:#cdb9a0; font-size:.68rem; letter-spacing:.34em; }
  .hd a[hidden]{ display:none; }
  .hd a{ color:#e8d9c4; font-size:.85rem; text-decoration:none; display:inline-block; margin-top:8px; }
  .wrap{ padding:20px 16px calc(64px + env(safe-area-inset-bottom)); }
  h1{ font-size:1.32rem; line-height:1.4; margin:0 0 8px; }
  .lead{ margin:0 0 8px; color:var(--ink2); font-size:.9rem; }
  .note{ font-size:.82rem; color:var(--muted); line-height:1.6; }
  .warn{ color:var(--red); font-size:.85rem; font-weight:700; margin:6px 0; }

  .hist{ font-size:.86rem; border-bottom:1px solid var(--line); padding:6px 0; }

  .st.d{ background:var(--green); color:var(--green-ink); }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2f2925; color:#fff; padding:10px 16px; border-radius:12px; font-size:.9rem; z-index:99; max-width:90vw; }

  .done .big{ font-size:3rem; }
  .prevbar{ background:#fff3d6; color:#7a5a12; font-size:.85rem; padding:8px 14px; font-weight:700; }

</head>
<body>
<div class="app">
  <div class="hd">
    <div class="co">SMILE HOUSING</div><div class="rule"></div><div class="sb">住まいるハウジング</div>
    <a id="backNote" href="#" hidden>← おうちノートへ戻る</a>

  <div class="wrap" id="main"><p class="note">読み込み中…</p></div>
</div>
<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var P = qs.get("p") || "", T = qs.get("t") || "";
  var DRAFT_KEY = "shunoPlan:" + (P || "public");
  var staffCode = ""; try{ staffCode = localStorage.getItem("sumairu_staff_token") || ""; }catch(e){}
  var C = null;      // サーバーから：部品の一覧など
  var S = null;      // お客様のプラン（下書き）
  var form = null;   // 場所の追加・直す画面（null＝閉じている）
  var sent = null;   // 送ったあと
  var main = document.getElementById("main");
  var NAME_PRESETS = ["ファミリークローゼット","パントリー","子供部屋 クローゼット","ウォークイン 奥の壁","ウォークイン 右の壁","ウォークイン 左の壁","玄関収納","寝室 クローゼット"];
  var MASU_CHOICES = [1,1.5,2,2.5,3,3.5,4];
  var BRACKETED = ["shelf","basket"];
  var UPRIGHT_CM = 2, WALL_CM = 5; // 1マス（91cm）→ 内側86cm＝80cmの1列

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function toast(m){ var d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200); }
  function yen(n){ return Number(n).toLocaleString("ja-JP") + "円"; }
  function uid(){ return "pl" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function part(id){ return C.parts.find(function(x){ return x.id===id; }) || null; }
  function uprights(){ return C.parts.filter(function(x){ return x.type==="upright"; }).sort(function(a,b){ return b.size-a.size; }); }
  function widths(){ return C.parts.filter(function(x){ return x.type==="shelf"; }).map(function(x){ return x.size; }); }
  function maxOf(up){ var m = up && Number(up.max); if(m>0) return m; var h = up ? up.size : 200; return h>=200 ? 8 : (h>=120 ? 5 : 3); }
  function typeInfo(t){ return (C.placeTypes && C.placeTypes[t]) || {name:t, stdShelves:1}; }
  function masuText(m){ return String(m).replace(/\.5$/, ".5") + "マス"; }

  // ---- 計算（netlify/lib/boaxel.mts と同じ内容） ----
  function placeInner(p){ if(p.wmode==="cm" && Number(p.cm)>0) return Math.min(800, Number(p.cm)); var m = Number(p.masu)||0; return m>0 ? Math.max(0, m*(C.masuCm||91) - WALL_CM) : 0; }
  function colsForInner(inner){
    var ws = Array.from(new Set(widths())).sort(function(a,b){ return b-a; }), best = [], bestSum = 0;
    for(var n=1; n<=10; n++){
      (function rec(left, from, acc){
        if(left===0){ var sum = acc.reduce(function(a,b){ return a+b; }, 0); if(sum + (acc.length+1)*UPRIGHT_CM <= inner && sum > bestSum){ best = acc.slice(); bestSum = sum; } return; }
        for(var i=from; i<ws.length; i++){ acc.push(ws[i]); rec(left-1, i, acc); acc.pop(); }
      })(n, 0, []);
    }
    return best;
  }
  // マスが整数なら1マス＝80cmの1列ずつ（例：2マス＝80＋80）。半マス・測った幅は、入るいちばん広い組み合わせ
  function colsFor(p){
    var m = Number(p.masu)||0;
    if(p.wmode!=="cm" && m>0 && m===Math.floor(m) && widths().indexOf(80)>=0) return Array.from({length:m}, function(){ return 80; });
    return colsForInner(placeInner(p));
  }
  function bracketCount(cols){
    var n = 0, rows = cols.reduce(function(a,c){ return Math.max(a, c.length); }, 0);
    for(var r=0; r<rows; r++){
      var run = 0;
      cols.forEach(function(c){ var x = part(c[r]); if(x && BRACKETED.indexOf(x.type)>=0) run++; else { if(run) n += run+1; run = 0; } });
      if(run) n += run+1;
    }
    return n;
  }
  // 列の種類：hang（服掛け）／shelf（棚）／set:<見本ID>（スタッフが作った見本。その幅のものだけ）
  function setsFor(w){ return (C.sets||[]).filter(function(st){ return st.w===w; }); }
  function setOf(kind){ return (C.sets||[]).find(function(st){ return "set:"+st.id===kind; }) || null; }
  function colKind(k, ptype, w){ k = String(k||""); if(C.placeTypes[k]) return k; if(k.indexOf("set:")===0 && setsFor(w).some(function(st){ return "set:"+st.id===k; })) return k; return C.placeTypes[ptype] ? ptype : "hang"; }
  function stdKind(kind, items){ if(C.placeTypes[kind]) return kind; return items.some(function(id){ var x = part(id); return x && x.type==="rail"; }) ? "hang" : "shelf"; }
  function kindName(kind){ if(C.placeTypes[kind]) return C.placeTypes[kind].colName || C.placeTypes[kind].name; var st = setOf(kind); return st ? st.name : "見本"; }
  function sizedOf(type, w){ return C.parts.find(function(x){ return x.type===type && x.size===w; }) || null; }
  function okW(w){ return function(id){ var x = part(id); return !!(x && x.type!=="upright" && x.type!=="bracket" && x.size===w); }; }
  // その種類の最初の中身（服掛け＝棚1枚＋ハンガー、棚＝棚4枚、見本＝見本の中身）
  function defaultItems(kind, w, max){
    if(kind.indexOf("set:")===0){ var st = setOf(kind); return st ? st.items.filter(okW(w)).slice(0, max) : []; }
    var sh = sizedOf("shelf", w), n = Math.min(max, typeInfo(kind).stdShelves), a = [];
    for(var i=0; i<n && sh; i++) a.push(sh.id);
    if(kind==="hang"){ var ra = sizedOf("rail", w); if(ra && a.length < max) a.push(ra.id); }
    return a;
  }
  function kindsFor(w){ return ["hang","shelf"].concat(setsFor(w).map(function(st){ return "set:"+st.id; })); }
  // 1列分（幅・種類・部品・どれが標準か）。標準＝その列の種類の棚の枚数まで（金額に入れない。外すこともできる）
  function colOf(w, kind, items, max){
    var left = Math.min(max, typeInfo(stdKind(kind, items)).stdShelves);
    var stdArr = items.map(function(id){ var x = part(id); return (left>0 && x && x.type==="shelf") ? (left--, id) : ""; });
    return { w:w, kind:kind, items:items, stdArr:stdArr, std:stdArr.filter(Boolean) };
  }
  function placeCols(p){
    var up = uprights()[0], max = maxOf(up), ws = colsFor(p);
    var cols = ws.map(function(w, i){
      var sc = (p.cols && p.cols[i]) || {}, kind = colKind(sc.kind, p.type, w);
      var items = Array.isArray(sc.items) ? sc.items.filter(okW(w)) : defaultItems(kind, w, max);
      return colOf(w, kind, items, max);
    });
    return { up:up, max:max, cols:cols, type:p.type };
  }
  // 列の並びを幅に合わせる（幅が変わったら同じ部品の新しい幅に入れ替える・以前の形の下書きも直す）
  function syncCols(p){
    var ws = colsFor(p), max = maxOf(uprights()[0]);
    var old = p.cols || [], oldW = p._ws || [];
    p.cols = ws.map(function(w, i){
      var o = old[i];
      if(!o) { var k0 = colKind("", p.type, w); return { kind:k0, items:defaultItems(k0, w, max) }; }
      var kind = colKind(o.kind, p.type, w), ow = oldW[i] || w, items;
      if(Array.isArray(o.items)) items = o.items.slice();
      else { var sh = sizedOf("shelf", ow), n = Math.min(max, typeInfo(p.type).stdShelves); items = []; for(var j=0;j<n && sh;j++) items.push(sh.id); items = items.concat(o.extras || []); }
      if(ow!==w) items = items.map(function(id){ var x = part(id); var q = x && C.parts.find(function(y){ return y.type===x.type && y.name===x.name && y.size===w; }); return q ? q.id : null; }).filter(Boolean);
      return { kind: String(o.kind||"").indexOf("set:")===0 && kind!==o.kind ? colKind("", p.type, w) : kind, items: items.filter(okW(w)) };
    });
    p._ws = ws;
  }
  function calc(places){
    var count = {}, std = {}, br = C.parts.find(function(x){ return x.type==="bracket"; });
    var add = function(o, id, n){ if(id && n) o[id] = (o[id]||0) + n; };
    var per = places.map(function(p){
      var pc = placeCols(p), pcount = {}, pstd = {};
      if(!pc.cols.length) return { pc:pc, sub:0, partial:false };
      add(pcount, pc.up.id, pc.cols.length + 1); add(pstd, pc.up.id, pc.cols.length + 1); // 縦レールは標準（棚を付けるのに必ず要るため）
      pc.cols.forEach(function(c){ c.items.forEach(function(id){ add(pcount, id, 1); }); c.std.forEach(function(id){ add(pstd, id, 1); }); });
      if(br){ add(pcount, br.id, bracketCount(pc.cols.map(function(c){ return c.items; }))); add(pstd, br.id, bracketCount(pc.cols.map(function(c){ return c.stdArr; }))); }
      var sub = 0, partial = false;
      Object.keys(pcount).forEach(function(id){ var x = part(id), pay = pcount[id] - Math.min(pcount[id], pstd[id]||0); add(count, id, pcount[id]); add(std, id, pstd[id]||0); if(pay){ if(x.price!=null) sub += x.price*pay; else partial = true; } });
      return { pc:pc, sub:sub, partial:partial };
    });
    var lines = Object.keys(count).map(function(id){ var x = part(id), s = Math.min(count[id], std[id]||0), pay = count[id]-s; return { x:x, qty:count[id], std:s, sub: x.price!=null ? x.price*pay : (pay ? null : 0) }; });
    var all = lines.every(function(l){ return l.sub!=null; });
    return { per:per, lines:lines, total: all ? lines.reduce(function(a,l){ return a + (l.sub||0); }, 0) : null, partial: !all };
  }

  // ---- 絵 ----
  // 段（上から何段目）ごとの高さ（縦レールの上からcm）。どの列も同じ段は同じ高さにそろえる。
  // ハンガーパイプの無い場所は、高さを段の数で均等に割る（棚収納など）。
  // ハンガーがある場所は、上の棚→その下にハンガーと服（約95cm）→その下にカゴ・棚、の順に実際に近い位置に置き、
  // 入りきらないときは縦レールの長さに合わせて縮める。
  function rowYs(pc, H){
    var cols = pc.cols, n = cols.reduce(function(a,c){ return Math.max(a, c.items.length); }, 0);
    if(!n) return [];
    var typeAt = function(c, r){ var x = c.items[r] ? part(c.items[r]) : null; return x ? x.type : ""; };
    var hasRail = cols.some(function(c){ return c.items.some(function(id){ var x = part(id); return x && x.type==="rail"; }); });
    var ys = [], r;
    if(!hasRail){ for(r=0;r<n;r++) ys.push(H*(r+1)/(n+1)); return ys; }
    var top = 22, gapOf = { shelf:30, basket:28, rail:102, drawer:28, shoe:25, other:28 };
    ys.push(top);
    for(r=1;r<n;r++){
      var need = ys[r-1] + 18;
      cols.forEach(function(c){
        var t = typeAt(c, r), pt = typeAt(c, r-1);
        if(!t || !pt) return;
        if(t==="rail" && pt!=="rail") need = Math.max(need, ys[r-1] + 5);
        else need = Math.max(need, ys[r-1] + (gapOf[pt]||28) + (t==="basket" ? 8 : 0));
      });
      // ハンガーの段のすぐ後だけ詰めてよい（棚の直下にハンガーを付けるため）
      if(cols.every(function(c){ var t = typeAt(c, r); return !t || t==="rail"; }) && cols.some(function(c){ return typeAt(c, r)==="rail" && typeAt(c, r-1)==="shelf"; })) need = Math.min(need, ys[r-1] + 5);
      ys.push(need);
    }
    // 縦レールに入りきらないときは縮める
    var last = ys[n-1], limit = H - 12;
    if(last > limit){ var k = (limit - top) / Math.max(1, last - top); ys = ys.map(function(y){ return top + (y - top)*k; }); }
    return ys;
  }
  var svgSeq = 0;
  var CLOTH_COLORS = ["#cdb9a3","#8ea2b7","#ece1d3","#76866f","#d7a49c","#4f5d75","#f3ece2","#a5896b","#b9c6cf","#7e5f55"];
  function svgOf(pc, mini){
    var cols = pc.cols, H = pc.up ? pc.up.size : 200, U = UPRIGHT_CM;
    var W = Math.max(40, cols.reduce(function(a,c){ return a + c.w; }, 0) + (cols.length+1)*U);
    var D = 9, TW = W + D*2, TH = H + D*2 + (mini ? 0 : 12), g = "bx" + (++svgSeq), out = [];
    var f = function(n){ return Math.round(n*100)/100; };
    out.push('<defs>'+
      '<linearGradient id="'+g+'wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#ece4d8"/></linearGradient>'+
      '<radialGradient id="'+g+'light" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>'+
      '<linearGradient id="'+g+'sideL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9cfc2"/><stop offset="1" stop-color="#e9e1d5"/></linearGradient>'+
      '<linearGradient id="'+g+'sideR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#d4c9bb"/><stop offset="1" stop-color="#e6ddd0"/></linearGradient>'+
      '<linearGradient id="'+g+'ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3dace"/><stop offset="1" stop-color="#efe8de"/></linearGradient>'+
      '<linearGradient id="'+g+'floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b99a76"/><stop offset="1" stop-color="#8f7254"/></linearGradient>'+
      '<linearGradient id="'+g+'metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2e2e2e"/><stop offset=".45" stop-color="#8c8c8c"/><stop offset="1" stop-color="#3a3a3a"/></linearGradient>'+
      '<linearGradient id="'+g+'rod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e6e6"/><stop offset=".5" stop-color="#9a9a9a"/><stop offset="1" stop-color="#5a5a5a"/></linearGradient>'+
      '<linearGradient id="'+g+'woodTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7d3b4"/><stop offset="1" stop-color="#d7bd97"/></linearGradient>'+
      '<linearGradient id="'+g+'woodEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c49f73"/><stop offset="1" stop-color="#9c7a52"/></linearGradient>'+
      '<linearGradient id="'+g+'shadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2e22" stop-opacity=".22"/><stop offset="1" stop-color="#3b2e22" stop-opacity="0"/></linearGradient>'+
      '<linearGradient id="'+g+'cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>'+
      '<pattern id="'+g+'mesh" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 0 L3 3 M3 0 L0 3" stroke="#8a8f94" stroke-width=".35"/></pattern>'+
      '<pattern id="'+g+'grain" width="14" height="3" patternUnits="userSpaceOnUse"><path d="M0 1.2 C4 .6 9 1.9 14 1.1" stroke="#b08a5f" stroke-width=".25" fill="none" opacity=".55"/></pattern>'+
    '</defs>');
    // 部屋（天井・左右の壁・床・奥の壁）
    out.push('<rect x="0" y="0" width="'+TW+'" height="'+TH+'" fill="#fff"/>');
    out.push('<polygon points="0,0 '+TW+',0 '+(TW-D)+','+D+' '+D+','+D+'" fill="url(#'+g+'ceil)"/>');
    out.push('<polygon points="0,0 '+D+','+D+' '+D+','+(D+H)+' 0,'+(H+2*D)+'" fill="url(#'+g+'sideL)"/>');
    out.push('<polygon points="'+TW+',0 '+(TW-D)+','+D+' '+(TW-D)+','+(D+H)+' '+TW+','+(H+2*D)+'" fill="url(#'+g+'sideR)"/>');
    out.push('<polygon points="0,'+(H+2*D)+' '+D+','+(D+H)+' '+(TW-D)+','+(D+H)+' '+TW+','+(H+2*D)+'" fill="url(#'+g+'floor)"/>');
    out.push('<rect x="'+D+'" y="'+D+'" width="'+W+'" height="'+H+'" fill="url(#'+g+'wall)"/>');
    out.push('<rect x="'+D+'" y="'+D+'" width="'+W+'" height="'+H+'" fill="url(#'+g+'light)"/>');
    out.push('<rect x="'+D+'" y="'+(D+H-6)+'" width="'+W+'" height="6" fill="url(#'+g+'shadow)" transform="rotate(180 '+(D+W/2)+' '+(D+H-3)+')"/>');
    var ys = rowYs(pc, H), CLOTH = 95, x = D + U, back = [], front = [];
    cols.forEach(function(c){
      var yOf = function(i){ return D + ys[i]; };
      c.items.forEach(function(id, i){
        var it = part(id); if(!it) return;
        var y = yOf(i), x0 = x + .6, w = c.w - 1.2;
        if(it.type==="shelf"){
          back.push('<rect x="'+x0+'" y="'+f(y+2.2)+'" width="'+w+'" height="9" fill="url(#'+g+'shadow)"/>');
          front.push('<polygon points="'+f(x0+1.6)+','+f(y-3.6)+' '+f(x0+w-1.6)+','+f(y-3.6)+' '+f(x0+w)+','+y+' '+x0+','+y+'" fill="url(#'+g+'woodTop)"/>'+
            '<polygon points="'+f(x0+1.6)+','+f(y-3.6)+' '+f(x0+w-1.6)+','+f(y-3.6)+' '+f(x0+w)+','+y+' '+x0+','+y+'" fill="url(#'+g+'grain)"/>'+
            '<rect x="'+x0+'" y="'+y+'" width="'+w+'" height="2.2" fill="url(#'+g+'woodEdge)" rx=".3"/>');
        } else if(it.type==="basket"){
          var bt = y - 7, bh = 15;
          back.push('<rect x="'+(x0+1)+'" y="'+f(bt+bh)+'" width="'+(w-2)+'" height="6" fill="url(#'+g+'shadow)"/>');
          front.push('<polygon points="'+f(x0+2)+','+f(bt-3)+' '+f(x0+w-2)+','+f(bt-3)+' '+f(x0+w-.6)+','+bt+' '+f(x0+.6)+','+bt+'" fill="#d4d7da" stroke="#7b8085" stroke-width=".4"/>'+
            '<rect x="'+f(x0+.6)+'" y="'+bt+'" width="'+f(w-1.2)+'" height="'+bh+'" fill="#eef0f2" stroke="#6f7479" stroke-width=".6" rx=".6"/>'+
            '<rect x="'+f(x0+.6)+'" y="'+bt+'" width="'+f(w-1.2)+'" height="'+bh+'" fill="url(#'+g+'mesh)" rx=".6"/>'+
            '<rect x="'+f(x0+.6)+'" y="'+bt+'" width="'+f(w-1.2)+'" height="1.2" fill="#5f6469"/>'+
            '<rect x="'+f(x0+w/2-4)+'" y="'+f(bt+2.5)+'" width="8" height="2" fill="#fff" stroke="#6f7479" stroke-width=".35" rx="1"/>');
        } else if(it.type==="rail"){
          // ハンガーは棚の下に付く：すぐ上が棚ならその直下、無ければこの段に描く
          var prev = i>0 ? part(c.items[i-1]) : null;
          var ry = prev && prev.type==="shelf" ? yOf(i-1) + 6 : y;
          var below = H + D - 2;
          for(var j=i+1;j<c.items.length;j++){ var nx = part(c.items[j]); if(nx){ below = yOf(j) - (nx.type==="basket" ? 11 : 5); break; } }
          var clen = Math.max(12, Math.min(CLOTH, below - ry - 7));
          var nh = Math.max(3, Math.round(w/9)), cl = [];
          for(var k=0;k<nh;k++){
            var hx = x0 + 4 + (w-8)*k/(nh-1), col = CLOTH_COLORS[(k*7 + Math.round(x)) % CLOTH_COLORS.length];
            var len = clen * (k%3===1 ? .62 : (k%4===2 ? .85 : 1)), sw = 6.4, top = ry + 6;
            cl.push('<path d="M'+f(hx)+' '+f(ry-.6)+' q1.4 -1.8 0 -2.6" fill="none" stroke="#777" stroke-width=".45" transform="translate(0 3)"/>'+
              '<path d="M'+f(hx-sw/2)+' '+f(top)+' L'+f(hx)+' '+f(ry+2.6)+' L'+f(hx+sw/2)+' '+f(top)+'" fill="none" stroke="#6d6d6d" stroke-width=".45"/>'+
              '<path d="M'+f(hx-sw/2)+' '+f(top)+' Q'+f(hx-sw/2-1.2)+' '+f(top+len*.5)+' '+f(hx-sw/2+.2)+' '+f(top+len)+' L'+f(hx+sw/2-.2)+' '+f(top+len)+' Q'+f(hx+sw/2+1.2)+' '+f(top+len*.5)+' '+f(hx+sw/2)+' '+f(top)+' Q'+f(hx)+' '+f(top-1.6)+' '+f(hx-sw/2)+' '+f(top)+' Z" fill="'+col+'" stroke="rgba(0,0,0,.22)" stroke-width=".35"/>'+
              '<path d="M'+f(hx-sw/2)+' '+f(top)+' Q'+f(hx-sw/2-1.2)+' '+f(top+len*.5)+' '+f(hx-sw/2+.2)+' '+f(top+len)+' L'+f(hx+sw/2-.2)+' '+f(top+len)+' Q'+f(hx+sw/2+1.2)+' '+f(top+len*.5)+' '+f(hx+sw/2)+' '+f(top)+' Z" fill="url(#'+g+'cloth)"/>');
          }
          back.push('<rect x="'+x0+'" y="'+f(ry+3)+'" width="'+w+'" height="'+f(clen+6)+'" fill="#3b2e22" opacity=".05"/>');
          front.push(cl.join("")+'<rect x="'+x0+'" y="'+f(ry-1)+'" width="'+w+'" height="2" fill="url(#'+g+'rod)" rx="1"/>'+
            '<rect x="'+f(x0-.4)+'" y="'+f(ry-1.6)+'" width="1.4" height="3.2" fill="#555" rx=".4"/><rect x="'+f(x0+w-1)+'" y="'+f(ry-1.6)+'" width="1.4" height="3.2" fill="#555" rx=".4"/>');
        } else {
          front.push('<rect x="'+f(x0+.6)+'" y="'+f(y-6)+'" width="'+f(w-1.2)+'" height="12" fill="url(#'+g+'woodTop)" stroke="#9c7a52" stroke-width=".5" rx=".8"/>'+
            '<rect x="'+f(x0+w/2-5)+'" y="'+f(y-1)+'" width="10" height="1.6" fill="#7a6a60" rx=".8"/>');
        }
        if(BRACKETED.indexOf(it.type)>=0){
          var by = it.type==="basket" ? y - 7 : y + 2.2;
          front.push('<path d="M'+(x-.2)+' '+f(by)+' h3.2 l-3.2 4.2 z M'+(x+c.w+.2)+' '+f(by)+' h-3.2 l3.2 4.2 z" fill="#3a3a3a"/>');
        }
      });
      if(!mini) out.push('<text x="'+f(x + c.w/2)+'" y="'+(TH-2)+'" font-size="5.2" text-anchor="middle" fill="#5c534d" font-family="sans-serif">'+c.w+'cm</text>');
      x += c.w + U;
    });
    out.push(back.join(""));
    var xx = D;
    for(var u=0; u<=cols.length; u++){
      out.push('<rect x="'+f(xx+.6)+'" y="'+D+'" width="'+U+'" height="'+H+'" fill="#000" opacity=".12"/>'+
        '<rect x="'+f(xx)+'" y="'+D+'" width="'+U+'" height="'+H+'" fill="url(#'+g+'metal)"/>'+
        '<line x1="'+f(xx+U/2)+'" y1="'+(D+2)+'" x2="'+f(xx+U/2)+'" y2="'+(D+H-2)+'" stroke="#1d1d1d" stroke-width=".35" stroke-dasharray="1.2 2.2"/>');
      if(u<cols.length) xx += cols[u].w + U;
    }
    out.push(front.join(""));
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+TW+' '+TH+'">'+out.join("")+'</svg>';
  }

  // ---- 下書き ----
  function load(){
    var d = null; try{ d = JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); }catch(e){}
    S = d && Array.isArray(d.places) ? d : { places:[], note:"", contact:{name:"",phone:"",email:"",addr:""} };
    S.contact = S.contact || {name:"",phone:"",email:"",addr:""};
    var ups = uprights();
    S.places = S.places.filter(function(p){ return p && p.id; }).slice(0, 12);
    S.places.forEach(function(p){ if(!C.placeTypes[p.type]) p.type = "hang"; p.height = ups[0].id; p.cols = p.cols || []; if(!p._ws) p._ws = colsFor(p); syncCols(p); });
  }
  function save(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(S)); }catch(e){} }

  // ---- 画面 ----
  function fitText(p){
    var ws = colsFor(p);
    if(!ws.length) return '<div class="warn">この幅では、ボーアクセルが入りません（幅をご確認ください）</div>';
    return '<div class="fit">→ ' + ws.map(function(w){ return w+"cm"; }).join("＋") + "の" + ws.length + "列が入ります</div>";
  }
  function formHtml(){
    var f = form, ups = uprights();
    return '<div class="box" id="pform">'+
      '<b style="font-size:1.05rem;">'+(f.editId ? "✏️ 場所を直す" : "＋ 場所を足す")+'</b>'+
      '<label class="lbl">どこの収納ですか？</label>'+
      '<div class="chips">'+NAME_PRESETS.map(function(n){ return '<button type="button" class="chip'+(f.name===n?' on':'')+'" data-fname="'+esc(n)+'">'+esc(n)+'</button>'; }).join("")+'</div>'+
      '<input class="in" data-ff="name" maxlength="40" placeholder="例：2階 ウォークイン 奥の壁" value="'+esc(f.name)+'" style="margin-top:8px;">'+
      '<div class="note" style="margin-top:4px;">ウォークインは、壁ごとに1つずつ足してください。</div>'+
      '<label class="lbl">幅</label>'+
      '<div class="seg"><button type="button" class="btn'+(f.wmode==="masu"?' dk':'')+'" data-fwm="masu">マスで選ぶ</button><button type="button" class="btn'+(f.wmode==="cm"?' dk':'')+'" data-fwm="cm">測った幅（cm）</button></div>'+
      (f.wmode==="masu" ?
        '<div class="chips" style="margin-top:8px;">'+MASU_CHOICES.map(function(m){ return '<button type="button" class="chip'+(Number(f.masu)===m?' on':'')+'" data-fmasu="'+m+'">'+masuText(m)+'</button>'; }).join("")+'</div>' :
        '<input class="in" data-ff="cm" inputmode="decimal" placeholder="例：125" value="'+esc(f.cm||"")+'" style="margin-top:8px;"><div class="note">収納の内側の壁から壁までを、メジャーで測った幅（cm）。</div>')+
      '<div id="fitBox">'+(placeInner(f) ? fitText(f) : '')+'</div>'+
      '<label class="lbl">最初の種類<span class="note">（あとで列ごとに「服掛け」「棚」などに変えられます）</span></label>'+
      '<div class="seg">'+Object.keys(C.placeTypes).map(function(k){ var t = C.placeTypes[k]; return '<button type="button" class="tcard'+(f.type===k?' on':'')+'" data-ftype="'+k+'"><b>'+(k==="hang"?"👕 ":"📚 ")+esc(t.name)+'</b><span>'+(k==="hang"?"上に棚1枚＋その下にハンガー。服をかける収納":"棚"+t.stdShelves+"段。食品・小物を置く収納")+'</span></button>'; }).join("")+'</div>'+
      '<label class="lbl">高さ</label><div class="note">'+(ups[0]?ups[0].size:200)+'cm（縦レールの長さは1種類です）</div>'+
      '<div class="seg" style="margin-top:14px;"><button type="button" class="btn ghost" data-fcancel="1">やめる</button><button type="button" class="btn dk" data-fok="1">'+(f.editId?"この内容にする":"この場所を足す")+'</button></div>'+
    '</div>';
  }
  function kindCardHtml(idx, ci, c, k, max){
    var items = defaultItems(k, c.w, max), on = c.kind===k;
    var mini = svgOf({ up:uprights()[0], max:max, cols:[colOf(c.w, k, items, max)] }, true);
    return '<button type="button" class="kcard'+(on?' on':'')+'" data-ckind="'+idx+'|'+ci+'|'+esc(k)+'">'+mini+'<span>'+(k==="hang"?"👕 ":(k==="shelf"?"📚 ":"⭐ "))+esc(kindName(k))+'</span></button>';
  }
  function placeHtml(p, r, idx){
    var pc = r.pc;
    var addTypes = ["shelf","basket","rail"];
    var head = '<div class="phd"><div class="t"><h3>'+esc(p.name)+'</h3><div class="pmeta">'+(p.wmode==="cm" ? "内側の幅 "+esc(p.cm)+"cm" : masuText(p.masu)+"（約"+Math.round(Number(p.masu)*(C.masuCm||91))+"cm）")+'・'+esc(pc.cols.map(function(c){ return kindName(c.kind); }).join("＋"))+'・高さ'+(pc.up?pc.up.size:"")+'cm</div></div>'+
      '<button type="button" class="mini" data-pedit="'+idx+'">✏️ 直す</button><button type="button" class="mini" data-pdel="'+idx+'">✕</button></div>';
    if(!pc.cols.length) return '<div class="place">'+head+'<div class="warn">この幅では、ボーアクセルが入りません。「直す」で幅をご確認ください。</div></div>';
    return '<div class="place">'+head+
      '<div class="svg">'+svgOf(pc)+'</div>'+
      '<div class="note">絵は、だいたいのイメージです。列ごとに種類を選べます。標準（金額に入らない分）は、服掛けの列は棚1枚、棚の列は棚4枚です。標準の棚も、外したり並べ替えたりできます。</div>'+
      '<div class="cols" style="margin-top:8px;">'+pc.cols.map(function(c, ci){
        var left = pc.max - c.items.length;
        return '<div class="col'+(left<0?' over':'')+'"><div class="ch">'+(ci+1)+'列目（幅'+c.w+'cm）</div>'+
          '<div class="kinds">'+kindsFor(c.w).map(function(k){ return kindCardHtml(idx, ci, c, k, pc.max); }).join("")+'</div>'+
          c.items.map(function(id, i){ var x = part(id), isStd = !!c.stdArr[i];
            return '<div class="it"><span>'+(i+1)+'段目 '+esc(x?x.name:"")+(isStd?'<em class="std">標準</em>':'')+'</span>'+
              '<button type="button" class="mini" data-imv="'+idx+'|'+ci+'|'+i+'|-1"'+(i===0?' disabled':'')+'>▲</button><button type="button" class="mini" data-imv="'+idx+'|'+ci+'|'+i+'|1"'+(i===c.items.length-1?' disabled':'')+'>▼</button><button type="button" class="mini" data-idel="'+idx+'|'+ci+'|'+i+'">✕</button></div>';
          }).join("")+
          (left<0 ? '<div class="warn">高さ'+(pc.up?pc.up.size:"")+'cmでは'+pc.max+'段までです。'+(-left)+'つ外してください。</div>' : '<div class="left">あと'+left+'段</div>')+
          '<div class="adds">'+C.parts.filter(function(x){ return addTypes.indexOf(x.type)>=0 && x.size===c.w; }).map(function(x){ return '<button type="button" data-iadd="'+idx+'|'+ci+'|'+esc(x.id)+'"'+(left>0?'':' disabled')+'>＋'+esc(x.name)+'</button>'; }).join("")+'</div></div>';
      }).join("")+'</div>'+
      '<div class="sub">'+(r.sub||r.partial ? "この場所の追加分："+(r.partial ? "金額は弊社からお知らせします" : yen(r.sub)) : "この場所の追加分：なし（標準のまま）")+'</div>'+
    '</div>';
  }
  function render(){
    if(sent){ main.innerHTML = '<div class="done"><div class="big">🧺</div><h1>ご依頼ありがとうございました</h1><p class="lead">内容を確認して、住まいるハウジングからご連絡します。</p>'+(P?'<p><a class="btn dk" href="/note/?p='+encodeURIComponent(P)+'&t='+encodeURIComponent(T)+'">おうちノートへ戻る</a></p>':'')+'<p><button type="button" class="btn ghost" data-again="1">続けて別のプランを作る</button></p></div>'; return; }
    var r = calc(S.places), over = r.per.some(function(x){ return x.pc.cols.some(function(c){ return c.items.length > x.pc.max; }) || !x.pc.cols.length; });
    var h = '<h1>🧺 収納プラン（IKEA ボーアクセル）</h1>'+
      '<p class="lead">収納の場所ごとに、棚・カゴ・ハンガーを選んでください。選んだ内容で、弊社が部品を注文して取り付けます。</p>'+
      '<div class="masuhelp"><b>📏「マス」について</b><br>1マス＝約91cm。図面の「910」が1マス、「1,365」が1.5マス、「1,820」が2マスです。<br>クローゼットの扉（片方）1枚分くらいが1マスの目安です。わからないときは、メジャーで測った幅（cm）でも大丈夫です。</div>';
    if(!form) h += S.places.map(function(p, i){ return placeHtml(p, r.per[i], i); }).join("");
    h += form ? formHtml() : '<button type="button" class="btn full" data-padd="1" style="margin:12px 0;">＋ 場所を足す</button>';
    if(!form && S.places.length){
      h += '<div class="box"><b>必要な部品（全部の場所）</b>'+
        '<table class="parts">'+r.lines.map(function(l){ return '<tr><td>'+esc(l.x.name)+(l.x.size?' '+l.x.size+'cm':'')+(l.std?'<div class="note">うち標準 '+l.std+'</div>':'')+'</td><td class="n">× '+l.qty+'</td><td class="n">'+(l.sub ? yen(l.sub) : (l.sub===0 ? (l.std?'標準':'') : ''))+'</td></tr>'; }).join("")+'</table>'+
        (r.total!=null ? '<div class="tot">追加分の目安：'+yen(r.total)+'</div>' : '<div class="note" style="text-align:right;margin-top:6px;">一部の部品は金額が未設定です（弊社からお知らせします）</div>')+
        '<div class="note">標準の分（縦レール・各列の標準の棚とそのブラケット）は金額に入りません。金額は部品代の目安（税込）です。取り付けなどを含めた金額は、弊社からお見積りします。'+(C.note?'<br>'+esc(C.note).replace(/\n/g,"<br>"):'')+'</div></div>';
      if(C.mode==="public"){
        var ct = S.contact;
        h += '<div class="box"><b>お客様のこと</b>'+
          '<label class="lbl">お名前（必須）</label><input class="in" data-ct="name" maxlength="50" autocomplete="name" value="'+esc(ct.name)+'">'+
          '<label class="lbl">電話番号</label><input class="in" data-ct="phone" inputmode="tel" autocomplete="tel" value="'+esc(ct.phone)+'">'+
          '<label class="lbl">メールアドレス</label><input class="in" data-ct="email" inputmode="email" autocomplete="email" value="'+esc(ct.email)+'">'+
          '<div class="note">電話番号かメールアドレスのどちらかは必ずご入力ください。</div>'+
          '<label class="lbl">ご住所・建てた年など（わかれば）</label><input class="in" data-ct="addr" maxlength="100" value="'+esc(ct.addr)+'">'+
          '<div class="hp"><input data-hp="1" tabindex="-1" autocomplete="off"></div></div>';
      }
      h += '<label class="lbl">ひとこと（なくても大丈夫です）</label><textarea class="in" data-fnote="1" rows="3" placeholder="例：カゴの数は相談したいです">'+esc(S.note||"")+'</textarea>'+
        '<button type="button" class="btn dk full" id="send" style="margin-top:12px;"'+(over?' disabled':'')+'>この内容で依頼する</button>'+
        (over ? '<div class="warn">入らない場所・段数をこえた列があります。直してから依頼してください。</div>' : '');
    }
    if(C.requests && C.requests.length){
      h += '<div class="box"><b>これまでのご依頼</b>'+C.requests.map(function(q){ return '<div class="hist"><span class="st'+(q.state==="ご注文済み"?' d':'')+'">'+esc(q.state)+'</span>'+esc(String(q.at||"").slice(0,10).replace(/-/g,"/"))+'・'+esc(q.names)+(q.total!=null?'（追加分の目安 '+yen(q.total)+'）':'')+'</div>'; }).join("")+'</div>';
    }
    var y = window.scrollY;
    main.innerHTML = h;
    if(form) setTimeout(function(){ var el = document.getElementById("pform"); if(el && !form._scrolled){ el.scrollIntoView({block:"start"}); form._scrolled = true; } }, 0); else window.scrollTo(0, y);
  }
  function openForm(idx){
    var ups = uprights();
    if(idx==null) form = { name:"", wmode:"masu", masu:1, cm:"", type:"hang", height:ups[0].id };
    else { var p = S.places[idx]; form = { editId:p.id, name:p.name, wmode:p.wmode||"masu", masu:p.masu||1, cm:p.cm||"", type:p.type, height:ups[0].id }; }
    render();
  }
  function commitForm(){
    var f = form, name = String(f.name||"").trim();
    if(!name){ toast("どこの収納か選ぶか、書いてください"); return; }
    if(!placeInner(f) || !colsFor(f).length){ toast("幅をご確認ください（この幅では入りません）"); return; }
    var p = f.editId ? S.places.find(function(x){ return x.id===f.editId; }) : null;
    if(!p){ p = { id:uid(), cols:[] }; S.places.push(p); }
    p.name = name.slice(0,40); p.wmode = f.wmode; p.masu = Number(f.masu)||0; p.cm = f.wmode==="cm" ? Number(f.cm)||0 : 0; p.type = f.type; p.height = f.height;
    syncCols(p);
    form = null; save(); render();
  }

  main.addEventListener("click", async function(e){
    var t;
    if(e.target.closest("[data-again]")){ sent = null; render(); return; }
    if(e.target.closest("[data-padd]")){ if(S.places.length>=12){ toast("場所は12か所までです"); return; } openForm(null); return; }
    if((t = e.target.closest("[data-pedit]"))){ openForm(+t.dataset.pedit); return; }
    if((t = e.target.closest("[data-pdel]"))){ var p0 = S.places[+t.dataset.pdel]; if(!confirm("「"+p0.name+"」を外しますか？")) return; S.places.splice(+t.dataset.pdel, 1); save(); render(); return; }
    if(form){
      if((t = e.target.closest("[data-fname]"))){ form.name = t.dataset.fname; render(); return; }
      if((t = e.target.closest("[data-fwm]"))){ form.wmode = t.dataset.fwm; render(); return; }
      if((t = e.target.closest("[data-fmasu]"))){ form.masu = Number(t.dataset.fmasu); render(); return; }
      if((t = e.target.closest("[data-ftype]"))){ form.type = t.dataset.ftype; render(); return; }
      if(e.target.closest("[data-fcancel]")){ form = null; render(); return; }
      if(e.target.closest("[data-fok]")){ commitForm(); return; }
    }
    var colAt = function(pi, ci){ var p = S.places[pi]; syncCols(p); return p.cols[ci]; };
    if((t = e.target.closest("[data-ckind]"))){ var kk = t.dataset.ckind.split("|"), pp = S.places[+kk[0]], cc = colAt(+kk[0], +kk[1]), w0 = placeCols(pp).cols[+kk[1]].w, mx = placeCols(pp).max, nk = kk.slice(2).join("|");
      if(!cc || cc.kind===nk) return;
      var cur = JSON.stringify(cc.items), def = JSON.stringify(defaultItems(cc.kind, w0, mx));
      if(cur!==def && !confirm((+kk[1]+1)+"列目の中身を「"+kindName(nk)+"」に入れ替えますか？（いまの棚・カゴの並びは消えます）")) return;
      cc.kind = nk; cc.items = defaultItems(nk, w0, mx); save(); render(); return; }
    if((t = e.target.closest("[data-iadd]"))){ var a = t.dataset.iadd.split("|"), pc = placeCols(S.places[+a[0]]), c = colAt(+a[0], +a[1]);
      if(c && c.items.length < pc.max){ c.items.push(a[2]); save(); render(); } return; }
    if((t = e.target.closest("[data-idel]"))){ var d = t.dataset.idel.split("|"); colAt(+d[0], +d[1]).items.splice(+d[2], 1); save(); render(); return; }
    if((t = e.target.closest("[data-imv]"))){ var m = t.dataset.imv.split("|"), ex = colAt(+m[0], +m[1]).items, i = +m[2], j = i + (+m[3]);
      if(j>=0 && j<ex.length){ var tmp = ex[i]; ex[i] = ex[j]; ex[j] = tmp; save(); render(); } return; }
    if(e.target.closest("#send")) await send(e.target.closest("#send"));
  });
  main.addEventListener("input", function(e){
    var f = e.target.closest("[data-ff]");
    if(f && form){ form[f.dataset.ff] = f.value; if(f.dataset.ff==="cm"){ var fb = document.getElementById("fitBox"); if(fb) fb.innerHTML = placeInner(form) ? fitText(form) : ""; } return; }
    var c = e.target.closest("[data-ct]"); if(c){ S.contact[c.dataset.ct] = c.value; save(); return; }
    if(e.target.closest("[data-fnote]")){ S.note = e.target.value; save(); }
  });
  main.addEventListener("change", function(e){ var f = e.target.closest("[data-ff]"); if(f && form){ form[f.dataset.ff] = f.value; } });

  // 絵をまとめて1枚の画像に
  function planImage(){
    return new Promise(function(resolve){
      try{
        var rs = calc(S.places).per, W = 1400, blocks = [], loaded = 0;
        if(!rs.length) return resolve("");
        rs.forEach(function(r, i){
          var img = new Image(), url = URL.createObjectURL(new Blob([svgOf(r.pc)], {type:"image/svg+xml"}));
          img.onload = function(){ blocks[i] = img; URL.revokeObjectURL(url); if(++loaded===rs.length) draw(); };
          img.onerror = function(){ blocks[i] = null; URL.revokeObjectURL(url); if(++loaded===rs.length) draw(); };
          img.src = url;
        });
        function draw(){
          var hs = blocks.map(function(img){ return img ? Math.min(900, Math.round(img.height * (W-80) / img.width)) : 0; });
          var H = 40 + hs.reduce(function(a,h){ return a + h + 90; }, 0);
          var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
          var g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,W,H);
          var y = 30;
          blocks.forEach(function(img, i){
            var p = S.places[i]; g.fillStyle = "#2f2925"; g.font = "bold 34px sans-serif";
            g.fillText(p.name + "（" + (p.wmode==="cm" ? p.cm+"cm" : masuText(p.masu)) + "・" + placeCols(p).cols.map(function(c){ return kindName(c.kind); }).join("＋") + "）", 40, y + 40);
            if(img){ var w = Math.round(img.width * hs[i] / img.height); g.drawImage(img, (W-w)/2, y + 60, w, hs[i]); }
            y += hs[i] + 90;
          });
          resolve(cv.toDataURL("image/jpeg", 0.85));
        }
      }catch(e){ resolve(""); }
    });
  }
  async function send(btn){
    if(C.mode==="public"){
      var ct = S.contact;
      if(!String(ct.name||"").trim()){ toast("お名前を入れてください"); return; }
      if(!String(ct.phone||"").trim() && !String(ct.email||"").trim()){ toast("電話番号かメールアドレスを入れてください"); return; }
    }
    if(!confirm("この内容で住まいるハウジングに依頼しますか？\n（このあと、弊社からご連絡します）")) return;
    btn.disabled = true;
    try{
      var image = await planImage();
      var hp = main.querySelector("[data-hp]");
      var res = await fetch("/api/shuno", { method:"POST", headers: Object.assign({"Content-Type":"application/json"}, staffCode ? {"x-staff-code":staffCode} : {}),
        body: JSON.stringify({ p:P, t:T, action:"request", plan:{ places: S.places.map(function(p){ return { name:p.name, type:p.type, masu:p.wmode==="cm"?0:p.masu, cm:p.wmode==="cm"?p.cm:0, height:p.height, cols:(p.cols||[]).map(function(c){ return { kind:c.kind, items:c.items }; }) }; }) },
          note:S.note||"", image:image, name:S.contact.name, phone:S.contact.phone, email:S.contact.email, addr:S.contact.addr, website: hp ? hp.value : "" }) });
      var j = await res.json().catch(function(){ return {}; });
      if(!res.ok) throw new Error(j.error||"error");
      if(j.req) C.requests = [j.req].concat(C.requests||[]);
      S.note = ""; save();
      sent = true; render(); window.scrollTo(0,0);
    }catch(er){
      var m = er && er.message;
      toast(m==="too_many" ? "ご依頼が多いため受け付けられませんでした。お電話でご連絡ください" : m==="too_narrow" ? "入らない幅の場所があります" : m==="too_many_items" ? "段数をこえた列があります" : m==="invalid_phone" ? "電話番号をご確認ください" : m==="invalid_email" ? "メールアドレスをご確認ください" : "送れませんでした。もう一度お試しください");
      btn.disabled = false;
    }
  }

  // ---- はじめ ----
  (async function(){
    if(P && T){ var bn = document.getElementById("backNote"); bn.href = "/note/?p="+encodeURIComponent(P)+"&t="+encodeURIComponent(T); bn.hidden = false; }
    try{
      var res = await fetch("/api/shuno" + (P ? "?p="+encodeURIComponent(P)+"&t="+encodeURIComponent(T) : ""), { headers: staffCode ? {"x-staff-code":staffCode} : {} });
      var j = await res.json().catch(function(){ return {}; });
      if(!res.ok) throw new Error(j.error||"error");
      C = j;
      if(j.preview) document.getElementById("prev").hidden = false;
      load(); render();
    }catch(e){
      main.innerHTML = '<h1>🧺 収納プラン</h1><p class="lead">'+(e && e.message==="invalid_link" ? "リンクが正しくありません。おうちノートから開き直してください。" : "いまはご利用いただけません。お手数ですが、住まいるハウジングへお問い合わせください。")+'</p>';
    }
  })();
})();
</script>
